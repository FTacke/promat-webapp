  description:
    de: "Pronunciation Matters ist eine mehrsprachige Plattform für Forschung und Lehre zur Aussprache von Fremdsprachenlernenden: Lernendenkorpora für Spanisch, Französisch, Deutsch und Englisch sowie Unterrichtsmaterialien zur Aussprache."
    en: "Pronunciation Matters is a multilingual platform for research and teaching on learner pronunciation: learner corpora for Spanish, French, German and English, and teaching resources on pronunciation."

