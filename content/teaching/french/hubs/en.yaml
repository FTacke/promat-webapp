title: Understanding French Pronunciation
overview_intro: The topic pages offer linguistic guidance, listening examples, and ideas for short pronunciation activities in French lessons. Often, just ten minutes here and there are enough – and many of these features can be introduced as early as A1 with suitable examples.
card_columns: 2
groups:
- title: Getting started
  description: A first look at a characteristic pronunciation feature of French.
  topics:
  - nasal-vowels
- title: Exploring pronunciation features
  description: Explore pronunciation patterns and discover ways to address them in the classroom.
  topics:
  - u-or-ou
  - liaison
  - schwa
  - spelling-and-pronunciation
  - french-stress
