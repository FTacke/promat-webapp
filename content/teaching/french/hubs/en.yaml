title: Understanding French Pronunciation
overview_intro: The topic pages on French pronunciation are currently being developed. They are intended to provide linguistic guidance on central pronunciation features – from nasal and rounded vowels to liaison and the fleeting e, spelling and stress – and to suggest short pronunciation activities for French lessons.
card_columns: 2
groups:
- title: Getting started
  description: A first look at a characteristic pronunciation feature of French.
  topics:
  - nasal-vowels
- title: Exploring pronunciation features
  description: Explore pronunciation patterns and discover ways to address them in the classroom.
  topics:
  - u-or-ou
  - liaison
  - schwa
  - spelling-and-pronunciation
  - french-stress
