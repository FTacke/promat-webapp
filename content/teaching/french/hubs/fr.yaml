title: Comprendre la prononciation du français
overview_intro: Les pages thématiques proposent des repères linguistiques, des exemples sonores et des idées de courtes activités de prononciation pour le cours de français. Dix minutes de temps en temps suffisent souvent – et de nombreux phénomènes peuvent être abordés dès le niveau A1 avec des exemples adaptés.
card_columns: 2
groups:
- title: La liaison
  description: Quand des consonnes finales muettes se font entendre – et ce que cela change pour la prononciation et la compréhension orale.
  topics:
  - liaison
