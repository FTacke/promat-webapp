  description: Ein erster Einblick in ein charakteristisches Aussprachephänomen des Französischen.
  topics:
  - nasal-vowels
- title: Aussprachephänomene entdecken
  description: Konkrete Aussprachemuster verstehen und im Unterricht aufgreifen.
