title: Französische Aussprache verstehen
overview_intro: Die Themenseiten zur französischen Aussprache entstehen derzeit. Sie sollen fachliche Orientierung zu zentralen Aussprachephänomenen geben – von Nasalvokalen und gerundeten Vokalen über die Liaison und das flüchtige e bis zu Schreibung und Betonung – und Anregungen für kurze Ausspracheimpulse im Französischunterricht bieten.
card_columns: 2
