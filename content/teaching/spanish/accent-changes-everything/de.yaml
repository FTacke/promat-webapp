- type: audio_contrast
  title: '*numeró* im Satz'
  lead: Auf welcher Silbe liegt die Betonung von *numeró*?
  transcript: El profesor explicó la regla y *numeró* ejemplos.
  examples:
  - label: Muttersprachliche Referenz
    subtitle: Chile · D30
    audio: corpus/p6-d30-ref.mp3
