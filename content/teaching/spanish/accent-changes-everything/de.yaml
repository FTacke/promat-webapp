resource_id: promat-teaching-es-accent-changes-everything
title: Ein Akzent verändert alles
summary: Wie die Betonung eines Wortes seine Bedeutung verändert – am Beispiel von *número*, *numero* und *numeró*.
description: Der lexikalische Wortakzent im Spanischen am Tripel *número* – *numero* – *numeró*, mit Hörvergleichen im isolierten Wort und im Satz.
equivalents:
  en: accent-changes-everything
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: '*número*, *numero*, *numeró*: dieselben Buchstaben, dieselben Laute – und drei verschiedene Wörter. Was sie unterscheidet, ist die Silbe, auf der die Betonung liegt. Im Spanischen kann die Position des Wortakzents Bedeutung unterscheiden.'
- type: overview
  title: Auf einen Blick
  items:
  - '*número* (Zahl, Nummer): Betonung auf der ersten Silbe.'
  - '*numero* (ich nummeriere): Betonung auf der zweiten Silbe.'
  - '*numeró* (er/sie nummerierte): Betonung auf der dritten Silbe.'
- type: section_heading
  title: Hören und entdecken
- type: text
  body: Zwei Aufnahmen, in denen drei Wörter nacheinander gesprochen werden, ohne Schriftbild. Hören Sie, welche Silbe jeweils betont ist – die erste, die zweite oder die dritte?
- type: audio_contrast
  title: Drei Wörter, drei Betonungen
  lead: Welche Silbe ist in jedem der drei Wörter betont?
  examples:
  - label: Muttersprachliche Referenz
    subtitle: Chile · W87
    audio: corpus/p6-numero3-ref.mp3
    token_id: ES-N-0005 · W87
  - label: Lernende:r (B1)
    subtitle: L1 Deutsch · W87
    audio: corpus/p6-numero3-learner.mp3
    token_id: ES-L-0005 · W87
- type: solution
  body: |-
    Die Reihenfolge ist *número* – *numero* – *numeró*:

    - *número* [ˈnu.me.ɾo]: Betonung auf der ersten Silbe – „Zahl“, „Nummer“.
    - *numero* [nu.ˈme.ɾo]: Betonung auf der zweiten Silbe – „ich nummeriere“.
    - *numeró* [nu.me.ˈɾo]: Betonung auf der dritten Silbe – „er/sie nummerierte“.

    Die Wörter sind nicht allein durch Lautstärke zu unterscheiden. Hören Sie auch auf Dauer und Tonhöhe der betonten Silbe.
- type: section_heading
  title: Wortakzent im Spanischen
- type: text
  body: 'Der **Wortakzent** ist die Hervorhebung einer Silbe innerhalb des Wortes. Im Spanischen ist er **lexikalisch**: Seine Position gehört zum Wort und kann Bedeutung unterscheiden. Akustisch ist er nicht einfach „lauter sprechen“: Dauer, Grundfrequenz (Tonhöhe) und Intensität tragen zur Prominenz bei, und ihr Zusammenspiel hängt vom Satzkontext ab. Anders als im Deutschen werden unbetonte Vokale im Spanischen kaum zum Schwa reduziert: Alle drei Vokale in *número* bleiben deutlich *u*, *e* und *o*.'
- type: text
  body: 'Das Akzentzeichen (die *tilde*) macht die Betonungsposition in der Schrift sichtbar. Sie steht nur dort, wo das Wort von der Grundregel abweicht: Wörter auf Vokal, *n* oder *s* sind regelhaft auf der vorletzten Silbe betont (*numero*), andere auf der letzten. *número* und *numeró* weichen davon ab und tragen deshalb ein Zeichen. Diese Seite behandelt den Wortakzent, nicht die Regeln der Akzentschreibung im Einzelnen.'
- type: info_box
  title: Hören, nicht nur lesen
  body: Das Zeichen hilft beim Lesen und Schreiben. Beim Hören müssen Lernende die Betonung ohne Schriftbild erkennen und beim Sprechen selbst herstellen. Im Satz kommen Satzakzent und Intonation hinzu, die die Wortbetonung überlagern können.
- type: section_heading
  title: Weitere Vergleiche aus dem Korpus
- type: text
  body: Alle drei Formen wurden gezielt als Kontrast erhoben und stehen zusätzlich je in einem kontrollierten Satz. Dieselben Wörter und Sätze, gesprochen von einer muttersprachlichen Referenzaufnahme und von einer Lernendenaufnahme (Erstsprache Deutsch). Die Aufnahmen stammen aus den kontrollierten Wort- und Satzlisten von *Pronunciation Matters*; die Auswahl ist exemplarisch und beansprucht keine Repräsentativität.
- type: audio_contrast
  title: '*número* im Satz'
  lead: Auf welcher Silbe liegt die Betonung von *número*?
  transcript: ¿Por qué quieres tirar ese *número* de teléfono?
