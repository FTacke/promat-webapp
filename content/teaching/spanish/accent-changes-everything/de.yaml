- type: section_heading
  title: Für den Unterricht
- type: tip_box
  title: 'Kurzaufgabe: dreimal derselbe Satzrahmen'
  body: |-
    1. Die Lernenden sprechen *número – numero – numeró* und verändern nur die Betonung. Zum Mitklopfen: Auf die betonte Silbe klopfen.
    2. Die Lehrkraft spielt die Aufnahmen aus dem Satzvergleich ohne Schriftbild; die Lernenden zeigen mit Fingern (1, 2 oder 3), welche Silbe betont ist.
    3. Danach werden die Bedeutungen zugeordnet: Zahl – ich nummeriere – er/sie nummerierte.
