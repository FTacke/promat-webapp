- type: section_heading
  title: For the classroom
- type: tip_box
  title: 'Quick task: one frame, three words'
  body: |-
    1. Learners say *número – numero – numeró* and change only the stress. To keep the beat: tap on the stressed syllable.
    2. The teacher plays the sentence recordings without the written form; learners show with their fingers (1, 2 or 3) which syllable is stressed.
    3. Then the meanings are matched: number – I number – he/she numbered.
