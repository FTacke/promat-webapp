resource_id: promat-teaching-es-soft-spanish-hard-german
title: Soft Spanish, hard German
summary: Why Spanish often sounds more fluent than German – and what the glottal stop has to do with it.
description: Why Spanish often sounds more fluent than German – and what the glottal stop has to do with it.
equivalents:
  de: soft-spanish-hard-german
metadata:
  creators:
  - felix-tacke
  - ana-goas-perez
  created: 2026-10-10
  updated: 2026-10-16
blocks:
- type: topic_meta
- type: text
  body: A German accent in Spanish is not revealed by individual sounds alone. Sometimes it is small, barely noticed differences that change the sound of an entire utterance. Four listening comparisons make such subtleties audible – and show how they can be taken up in the classroom.
- type: audio_contrast
  title: 'Listening comparison: *o hay*'
  lead: What distinguishes the two pronunciations?
  transcript: '*o hay*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/o-hay-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/o-hay-learner.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    In the reference speaker's pronunciation, the vowels of *o hay* are linked smoothly: [o.ˈai]. The learner's pronunciation, by contrast, shows a typical feature of German: the **glottal stop [ʔ]**, which often occurs before words and syllables that begin with a vowel. The additional glottal stops [ʔo.ʔai] give the word sequence the sound that is often described as “hard” or “clipped”.
- type: section_heading
  title: How is the glottal stop produced?
- type: text
  body: The glottal stop [ʔ] is produced by a brief closure of the vocal folds in the larynx. In German it frequently occurs before words that begin with a vowel, as in *die Ente* [diː ˈʔɛntə].
- type: image
  src: glottal-stop-larynx-hand.png
  alt: 'Drawing of a woman in partial profile lightly touching her neck at the level of the larynx with her thumb and fingers; the laryngeal area is highlighted in violet.'
  caption: 'The hand gesture indicates the position of the larynx, where the glottal stop is produced.'
  credit: 'Illustration: Felix Tacke (concept and prompting), AI-generated · Pronunciation Matters (2026)'
- type: section_heading
  title: Where can learners produce glottal stops?
- type: text
  body: In German, syllables that begin with a vowel are also often started with a glottal stop. German-speaking learners sometimes transfer this pattern to Spanish – especially where two vowels meet. This applies both **between words** (*o hay*, *tiene hambre*) and **within a word**, as in *reír*.
- type: audio_contrast
  title: 'Listening comparison: *tiene hambre*'
  lead: How are the vowels joined at the word boundary?
  transcript: '*tiene hambre*'
  examples:
