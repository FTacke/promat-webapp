    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-learner.mp3
- type: audio_contrast
  title: 'Listening comparison: *reír*'
  lead: How is the transition between the two vowels realised?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Pronunciation Matters · W76
    audio: corpus/p1-reir-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · W76
    audio: corpus/p1-reir-learner.mp3
- type: section_heading
  title: When word boundaries blur
- type: text
  body: |-
    In Spanish, it is not only vowels meeting at a boundary that are linked smoothly. When a word ends in a consonant and the next one begins with a vowel, the consonant is normally assigned to the following syllable. So *sus amigos* becomes **su‑sa‑mi‑gos** in speech, and *los otros* correspondingly **lo‑so‑tros**: in each case, the word-final /s/ forms a syllable with the following vowel. This phenomenon is called **resyllabification** (Spanish: *resilabificación*).

    German-speaking learners, by contrast, sometimes orient themselves more strongly to the individual word boundaries and pronounce the words more clearly separated from one another. This, too, can create a more “clipped” impression.
- type: audio_contrast
  title: 'Listening comparison: *los otros*'
  lead: How are *los* and *otros* linked?
  transcript: '*los otros*'
  examples:
  - role: reference
    subtitle: Pronunciation Matters · QY5
    audio: corpus/p1-losotros-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · QY5
