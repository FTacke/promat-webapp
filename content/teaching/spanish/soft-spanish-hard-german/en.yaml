- type: section_heading
  title: For the classroom
- type: tip_box
  title: 'Quick task: first clipped, then fluent'
  body: |-
    1. Choose three word sequences: *tiene hambre*, *se oye*, *la euforia*.
    2. Learners say each sequence first with a deliberately audible break between the words, then fluently – as if it were a single word.
    3. They then record both versions on a smartphone and compare them with the reference recordings above.

    Guiding question: where do you feel the fresh start in your throat, and where does it disappear?
