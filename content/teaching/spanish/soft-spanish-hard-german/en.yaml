resource_id: promat-teaching-es-soft-spanish-hard-german
title: Soft Spanish, hard German
summary: Why Spanish often sounds more fluent, and how the German glottal stop can influence the pronunciation of Spanish words and word sequences.
description: How the German glottal stop [ʔ] can affect Spanish word sequences – with listening comparisons from the corpus and a short classroom task.
equivalents:
  de: soft-spanish-hard-german
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: |-
    Why does German often sound more clipped than Spanish?

    “Soft” and “hard” are impressions of listeners, not phonetic terms. This page ties the impression to one clearly audible detail: the transition between vowels at word boundaries.

    In German, a **glottal stop** [ʔ] is often produced before words or syllables that begin with a vowel: the vocal folds close briefly and then open again. In ordinary connected Spanish speech, such a hard onset is not characteristic – vowels are usually joined smoothly across word boundaries.
- type: overview
  title: At a glance
  items:
  - The German glottal stop [ʔ] often marks the onset of words and syllables that begin with a vowel.
  - In connected Spanish speech, words are linked into larger sound units; at vowel-to-vowel word boundaries a glottal closure is usually absent.
  - Learners sometimes transfer the German pattern to Spanish. This can be heard – but not in every recording.
- type: section_heading
  title: Listen and discover
- type: text
  body: 'Two recordings of the same sentence. Listen to the spot between *tiene* and *hambre*: the `h` is silent in Spanish, so two vowels meet at the word boundary.'
- type: audio_contrast
  title: '*tiene hambre*: smooth or interrupted?'
  lead: Where can you hear a brief interruption – and in which recording?
  transcript: Cuando el chico *tiene hambre*, pierde el control.
  examples:
  - label: Native-speaker reference
    subtitle: Mexico · D27
    audio: corpus/p1-hambre-ref.mp3
    token_id: ES-N-0004 · D27
  - label: Learner (B1)
    subtitle: L1 German · D27
    audio: corpus/p1-hambre-learner.mp3
    token_id: ES-L-0007 · D27
- type: solution
  body: |-
    What you are listening for is whether a glottal closure lies between *tiene* and *hambre*. In connected speech the two words run into each other: [ˈtje.ne.ˈam.bɾe]. With a glottal stop, a brief interruption arises before the *a*: [ˈtje.ne.ˈʔam.bɾe].

    The recordings were not chosen to demonstrate an error. Whether, and how clearly, a glottal stop is audible differs from recording to recording – so listen to the other comparisons as well.
- type: section_heading
  title: Why does it sound different?
- type: text
  body: |-
    In Spanish, words form larger sound units when spoken. Syllable boundaries often do not coincide with word boundaries: in *los amigos* the *s* becomes the onset of the next syllable [lo.sa.ˈmi.ɣos] (*enlace*). When two vowels meet, as in *tiene hambre* or *se oye*, they are joined without a glottal closure.

    In German, by contrast, a fresh start with [ʔ] before a vowel is widespread: *die Ente* [diː ˈʔɛn.tə]. German-speaking learners may carry this pattern over into Spanish – *si entiendo bien* then becomes [si.ʔen.ˈtjen.do.ˈβjen] instead of [si.en.ˈtjen.do.ˈβjen]. Additional interruptions change the rhythm and make speech sound more clipped.
- type: info_box
  title: What this comparison does not claim
  body: |-
    - “Soft” and “hard” describe an auditory impression, not a phonetic category. This is not a blanket contrast between the two languages.
    - German also allows word junctions without a glottal stop; the fresh start is not obligatory.
    - Spanish speakers, too, can glottalise depending on context, for instance under emphatic stress or after a pause.
    - What else can happen at vowel boundaries (merging, glides, hiatus) is a topic of its own and is not covered here.
    - Not every learner recording contains a glottal stop.
- type: section_heading
  title: More comparisons from the corpus
- type: text
  body: The same words and sentences, spoken by a native-speaker reference recording and by a learner recording (first language German). The recordings come from the controlled word and sentence lists of *Pronunciation Matters*; the selection is illustrative and makes no claim to be representative.
