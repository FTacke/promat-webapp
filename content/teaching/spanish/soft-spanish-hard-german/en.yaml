resource_id: promat-teaching-es-soft-spanish-hard-german
title: Soft Spanish, hard German
summary: Why Spanish often sounds more fluent than German – and what the glottal stop has to do with it.
description: Why Spanish often sounds more fluent than German – and what the glottal stop has to do with it.
equivalents:
  de: soft-spanish-hard-german
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-11
blocks:
- type: topic_meta
- type: text
  body: Why does German often sound a little more “clipped” than Spanish? A small sound that often goes unnoticed plays an important part.
- type: section_heading
  title: Listen and discover
- type: text
  body: The two recordings of the same Spanish word sequence show a striking difference.
- type: audio_contrast
  title: 'With and without a glottal stop: *o hay*'
  lead: What distinguishes the two pronunciations?
  transcript: '*o hay*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/o-hay-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/o-hay-learner.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    In the learner recording, brief closures can be heard before both vowels – so-called glottal stops [ʔ]. They are absent from the Spanish reference recording, which makes the word sequence sound more fluent.

    Reference: [o.ˈai] · Learner recording: [ʔo.ʔai]
- type: section_heading
  title: Why do they sound different?
- type: text
  body: |-
    In German, words that begin with a vowel are often started with a brief closure of the vocal folds – the **glottal stop [ʔ]**, as in *die Ente*. In Spanish, by contrast, words are usually linked smoothly across word boundaries.

    A fresh onset of this kind is not categorically excluded in Spanish, but it is not part of the usual pronunciation pattern in connected speech.
- type: image
  src: glottal-stop-larynx-hand.png
  alt: 'Drawing of a woman in partial profile lightly touching her neck at the level of the larynx with her thumb and fingers; the laryngeal area is highlighted in violet.'
  caption: 'The glottal stop [ʔ] is produced by briefly closing the vocal folds in the larynx. The hand gesture illustrates the place of articulation.'
  credit: 'Illustration: Felix Tacke (concept and prompting), AI-generated · Pronunciation Matters (2026)'
- type: section_heading
  title: 'Another example: *tiene hambre*'
- type: text
  body: Here, too, two vowels meet across a word boundary. In ordinary connected speech they are joined without an additional glottal stop.
- type: audio_contrast
  title: 'No additional fresh onset: *tiene hambre*'
  lead: Is an additional glottal stop audible between the two words?
  transcript: Cuando el chico ***tiene hambre***, pierde el control.
  examples:
  - role: reference
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-learner.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: What matters is whether an additional glottal closure can be heard between *tiene* and *hambre*, or whether the vowels are joined without such a fresh onset.
- type: section_heading
  title: When syllables cross the word boundary
- type: text
  body: |-
    Smooth linking is not limited to vowels that meet at a word boundary. A word-final consonant can also be linked to the following vowel.

    In *sus amigos*, the /s/ of *sus* is linked to the initial /a/ of *amigos*: **su‑sa‑mi‑gos**.

    This phenomenon is called **resyllabification** (Spanish: *resilabificación*). The syllable boundary no longer coincides with the word boundary.
- type: audio_contrast
  title: 'Resyllabification: *sus amigos*'
  lead: How does the /s/ of *sus* connect to the following vowel?
  transcript: Con su familia es un ángel y con ***sus amigos*** un diablo.
  examples:
  - role: reference
    subtitle: Pronunciation Matters · D24
    audio: corpus/p1-amigos-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · D24
    audio: corpus/p1-amigos-learner.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    What matters is whether the /s/ belongs to the following syllable (*su‑sa‑mi‑gos*) or stays at the end of *sus*. In the first case, the two words are closely bound together in sound.
- type: section_heading
  title: 'Classroom prompts'
- type: text
  body: 'The listening comparisons help direct attention to differences between languages that often go unnoticed and sharpen phonetic awareness.'
- type: teaching_impulses
  items:
  - title: 'Listen first, explain later'
    body: 'Play the recordings first without any explanation. Where are interruptions audible, where are sounds linked smoothly? Collect the observations together and then place them in linguistic context.'
  - title: 'Try out pronunciation deliberately'
    body: 'Deliberately produce the German glottal stop, for instance in *die Ente*, and contrast it with *o hay* or *tiene hambre*. Then repeat the Spanish word sequences without an additional fresh onset and try out resyllabification with *sus amigos*.'
  - title: 'Compare languages'
    body: 'Widen the view to other languages: how are word boundaries realised in French, Italian or English? Where do glottal onsets occur, where are sounds linked? Comparisons like these raise awareness of different pronunciation patterns and encourage reflection across languages.'
