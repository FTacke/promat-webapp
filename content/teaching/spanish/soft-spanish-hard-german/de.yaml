title: Weiches Spanisch, hartes Deutsch
summary: Warum Spanisch häufig fließender klingt als Deutsch – und was der Knacklaut damit zu tun hat.
description: Warum Spanisch häufig fließender klingt als Deutsch – und was der Knacklaut damit zu tun hat.
