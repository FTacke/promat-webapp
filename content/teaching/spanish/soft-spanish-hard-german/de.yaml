title: Weiches Spanisch, hartes Deutsch
summary: Warum Spanisch häufig fließender klingt als Deutsch – und was der Knacklaut damit zu tun hat.
description: Warum Spanisch häufig fließender klingt als Deutsch – und was der Knacklaut damit zu tun hat.
equivalents:
  en: soft-spanish-hard-german
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-11
blocks:
- type: topic_meta
- type: text
  body: Warum klingt Deutsch häufig etwas „abgehackter“ als Spanisch? Ein kleiner, oft unbemerkter Laut spielt dabei eine wichtige Rolle.
- type: section_heading
  title: Hören und entdecken
- type: text
  body: Die beiden Aufnahmen derselben spanischen Wortfolge zeigen einen auffälligen Unterschied.
- type: audio_contrast
  title: 'Mit und ohne Knacklaut: *o hay*'
  lead: Was unterscheidet die beiden Aussprachen?
  transcript: '*o hay*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/o-hay-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/o-hay-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    In der Lernendenaufnahme sind vor beiden Vokalen kurze Verschlüsse zu hören, sogenannte Knacklaute [ʔ]. In der spanischsprachigen Referenzaufnahme fehlen sie; die Wortfolge klingt dadurch fließender.

    Referenz: [o.ˈai] · Lernendenaufnahme: [ʔo.ʔai]
- type: section_heading
  title: Warum klingt das unterschiedlich?
- type: text
  body: |-
    Im Deutschen beginnen wir vokalisch anlautende Wörter häufig mit einem kurzen Verschluss der Stimmlippen – dem **Knacklaut [ʔ]**. So etwa bei *die Ente*. Im Spanischen werden Wörter dagegen meist über ihre Grenzen hinweg fließend miteinander verbunden.

    Ein solcher Neueinsatz ist im Spanischen nicht grundsätzlich ausgeschlossen, gehört aber nicht zum gewöhnlichen Aussprachemuster in zusammenhängender Rede.
- type: image
  src: glottal-stop-larynx-hand.png
  alt: 'Zeichnung einer Frau im Halbprofil, die mit Daumen und Fingern leicht den Hals auf Höhe des Kehlkopfs berührt; der Bereich des Kehlkopfs ist violett hervorgehoben.'
  caption: 'Der Knacklaut [ʔ] entsteht durch einen kurzen Verschluss der Stimmlippen im Kehlkopf. Die Handhaltung veranschaulicht den Artikulationsort.'
  credit: 'Illustration: Felix Tacke (Konzept und Prompting), KI-generiert · Pronunciation Matters (2026)'
- type: section_heading
  title: 'Noch ein Beispiel: *tiene hambre*'
- type: text
  body: Auch hier treffen zwei Vokale über eine Wortgrenze hinweg aufeinander. Im gewöhnlichen Sprachfluss werden sie ohne zusätzlichen Knacklaut verbunden.
- type: audio_contrast
  title: 'Ohne zusätzlichen Neueinsatz: *tiene hambre*'
  lead: Ist zwischen den beiden Wörtern ein zusätzlicher Knacklaut zu hören?
  transcript: Cuando el chico ***tiene hambre***, pierde el control.
  examples:
  - role: reference
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: Entscheidend ist, ob zwischen *tiene* und *hambre* ein zusätzlicher glottaler Verschluss zu hören ist oder ob die Vokale ohne einen solchen Neueinsatz verbunden werden.
- type: section_heading
  title: Wenn Silben die Wortgrenze überschreiten
- type: text
  body: |-
    Der fließende Anschluss betrifft nicht nur aufeinandertreffende Vokale. Auch ein Konsonant am Wortende kann mit dem folgenden Vokal verbunden werden.

    Bei *sus amigos* wird das /s/ von *sus* mit dem anlautenden /a/ von *amigos* verbunden: **su‑sa‑mi‑gos**.

    Dieses Phänomen nennt man **Resilbifizierung** (spanisch: *resilabificación*). Die Silbengrenze stimmt dabei nicht mehr mit der Wortgrenze überein.
- type: audio_contrast
  title: 'Resilbifizierung: *sus amigos*'
  lead: Wie verbindet sich das /s/ von *sus* mit dem folgenden Vokal?
  transcript: Con su familia es un ángel y con ***sus amigos*** un diablo.
  examples:
  - role: reference
    subtitle: Pronunciation Matters · D24
    audio: corpus/p1-amigos-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · D24
    audio: corpus/p1-amigos-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    Entscheidend ist, ob das /s/ zur folgenden Silbe gehört (*su‑sa‑mi‑gos*) oder am Ende von *sus* bleibt. Im ersten Fall sind die beiden Wörter lautlich eng verknüpft.
- type: section_heading
  title: 'Impulse für den Unterricht'
- type: text
  body: 'Die Hörvergleiche eignen sich, um die Aufmerksamkeit auf oft unbemerkte Unterschiede zwischen den Sprachen zu lenken und die phonetische Sprachbewusstheit zu schärfen.'
- type: teaching_impulses
  items:
  - title: 'Erst hören, dann erklären'
    body: 'Die Aufnahmen zunächst ohne Erklärung abspielen. Wo sind Unterbrechungen hörbar, wo werden Laute fließend verbunden? Die Beobachtungen gemeinsam sammeln und anschließend linguistisch einordnen.'
  - title: 'Aussprache bewusst erproben'
    body: 'Den deutschen Knacklaut etwa an *die Ente* bewusst artikulieren und mit *o hay* oder *tiene hambre* kontrastieren. Anschließend die spanischen Wortfolgen ohne zusätzlichen Neueinsatz nachsprechen und bei *sus amigos* die Resilbifizierung erproben.'
  - title: 'Sprachen vergleichen'
    body: 'Den Blick auf weitere Fremdsprachen erweitern: Wie werden Wortgrenzen im Französischen, Italienischen oder Englischen realisiert? Wo treten glottale Neueinsätze auf, wo werden Laute verbunden? Solche Vergleiche machen unterschiedliche Aussprachemuster bewusst und fördern die sprachübergreifende Reflexion.'
- type: further_reading
  title: Vertiefung
  description: Weiterführende Seiten zu Aussprachemodellen und zum Knacklaut.
  items:
