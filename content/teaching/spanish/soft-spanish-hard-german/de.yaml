resource_id: promat-teaching-es-soft-spanish-hard-german
title: Weiches Spanisch, hartes Deutsch
summary: Warum Spanisch oft fließender klingt und wie der deutsche Knacklaut die Aussprache spanischer Wörter und Wortfolgen beeinflusst.
description: Wie der deutsche Knacklaut [ʔ] spanische Wortfolgen beeinflussen kann – mit Hörvergleichen aus dem Korpus und einer kurzen Unterrichtsaufgabe.
equivalents:
  en: soft-spanish-hard-german
