  - title: Welche Aussprache unterrichten?
    text: Welche Realisierung gilt als Maßstab – und warum regionale Variation keine Fehlerhierarchie bedeutet.
    cta: Zur Themenseite
    href: /de/teaching/spanish/which-pronunciation
