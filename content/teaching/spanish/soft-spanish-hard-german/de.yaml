- type: section_heading
  title: Für den Unterricht
- type: tip_box
  title: 'Kurzaufgabe: erst abgehackt, dann fließend'
  body: |-
    1. Wählen Sie drei Wortfolgen: *tiene hambre*, *se oye*, *la euforia*.
    2. Die Lernenden sprechen jede Folge zuerst mit bewusst hörbarer Unterbrechung zwischen den Wörtern, dann fließend – als wäre es ein einziges Wort.
    3. Anschließend nehmen sie beide Varianten mit dem Smartphone auf und vergleichen sie mit den Referenzaufnahmen oben.

    Leitfrage: Wo spüren Sie den Neueinsatz im Hals, und wo verschwindet er?
