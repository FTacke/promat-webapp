  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: |-
    Warum klingt Deutsch häufig etwas abgehackter als Spanisch?

    „Weich“ und „hart“ sind Höreindrücke, keine phonetischen Fachbegriffe. Diese Seite macht den Eindruck an einem einzigen, gut hörbaren Detail fest: dem Übergang zwischen Vokalen an Wortgrenzen.

    Im Deutschen wird vor vokalisch beginnenden Wörtern oder Silben häufig ein **Knacklaut** [ʔ] gesprochen: Die Stimmlippen schließen sich kurz und öffnen sich dann wieder. Im Spanischen ist ein solcher harter Neueinsatz in der gewöhnlichen verbundenen Rede dagegen nicht charakteristisch – Vokale werden über Wortgrenzen hinweg meist glatt aneinander angeschlossen.
- type: overview
  title: Auf einen Blick
  items:
  - Der deutsche Knacklaut [ʔ] markiert häufig den Neueinsatz vokalisch beginnender Wörter und Silben.
  - Im Spanischen werden Wörter in der verbundenen Rede zu größeren Lauteinheiten verknüpft; an vokalischen Wortgrenzen fehlt in der Regel der glottale Verschluss.
  - Lernende übertragen das deutsche Muster gelegentlich auf das Spanische. Das lässt sich hören – aber nicht in jeder Aufnahme.
- type: section_heading
  title: Hören und entdecken
- type: text
  body: 'Zwei Aufnahmen desselben Satzes. Achten Sie auf die Stelle zwischen *tiene* und *hambre*: Das `h` ist im Spanischen stumm, an der Wortgrenze treffen also zwei Vokale aufeinander.'
- type: audio_contrast
  title: '*tiene hambre*: glatt oder mit Unterbrechung?'
  lead: Wo ist eine kurze Unterbrechung zu hören – und in welcher Aufnahme?
  transcript: Cuando el chico *tiene hambre*, pierde el control.
  examples:
  - label: Muttersprachliche Referenz
    subtitle: Mexiko · D27
    audio: corpus/p1-hambre-ref.mp3
    token_id: ES-N-0004 · D27
  - label: Lernende:r (B1)
    subtitle: L1 Deutsch · D27
    audio: corpus/p1-hambre-learner.mp3
    token_id: ES-L-0007 · D27
- type: solution
  body: |-
    Gehört wird, ob zwischen *tiene* und *hambre* ein glottaler Verschluss liegt. In verbundener Aussprache gehen beide Wörter ineinander über: [ˈtje.ne.ˈam.bɾe]. Mit Knacklaut entsteht dagegen eine kurze Unterbrechung vor dem *a*: [ˈtje.ne.ˈʔam.bɾe].

    Die Aufnahmen wurden nicht ausgewählt, um einen Fehler vorzuführen. Ob und wie deutlich ein Knacklaut zu hören ist, unterscheidet sich von Aufnahme zu Aufnahme – hören Sie deshalb auch die weiteren Vergleiche.
- type: section_heading
  title: Warum klingt das unterschiedlich?
- type: text
  body: |-
    Im Spanischen bilden Wörter beim Sprechen größere lautliche Einheiten. Silbengrenzen fallen oft nicht mit Wortgrenzen zusammen: In *los amigos* wird das *s* zum Anlaut der nächsten Silbe [lo.sa.ˈmi.ɣos] (*enlace*). Treffen zwei Vokale aufeinander, wie in *tiene hambre* oder *se oye*, werden sie ohne glottalen Verschluss angeschlossen.

    Im Deutschen ist dagegen der Neueinsatz mit [ʔ] bei vokalischem Anlaut verbreitet: *die Ente* [diː ˈʔɛn.tə]. Deutschsprachige Lernende können dieses Muster auf das Spanische übertragen – *si entiendo bien* wird dann [si.ʔen.ˈtjen.do.ˈβjen] statt [si.en.ˈtjen.do.ˈβjen]. Zusätzliche Unterbrechungen verändern den Rhythmus und lassen die Rede abgehackter wirken.
- type: info_box
  title: Was dieser Vergleich nicht behauptet
  body: |-
    - „Weich“ und „hart“ beschreiben einen Höreindruck, keine phonetische Kategorie. Es geht nicht um eine pauschale Gegenüberstellung beider Sprachen.
    - Auch im Deutschen sind Wortverbindungen ohne Knacklaut möglich; der Neueinsatz ist nicht obligatorisch.
    - Auch spanischsprachige Menschen können kontextabhängig glottalisieren, etwa bei emphatischer Betonung oder nach einer Pause.
    - Was an Vokalgrenzen zusätzlich geschehen kann (Verschmelzung, Gleitlaute, Hiatus), ist ein eigenes Thema und wird hier nicht behandelt.
    - Nicht jede Lernendenaufnahme zeigt einen Knacklaut.
- type: section_heading
  title: Weitere Vergleiche aus dem Korpus
- type: text
  body: Dieselben Wörter und Sätze, gesprochen von einer muttersprachlichen Referenzaufnahme und von einer Lernendenaufnahme (Erstsprache Deutsch). Die Aufnahmen stammen aus den kontrollierten Wort- und Satzlisten von *Pronunciation Matters*; die Auswahl ist exemplarisch und beansprucht keine Repräsentativität.
