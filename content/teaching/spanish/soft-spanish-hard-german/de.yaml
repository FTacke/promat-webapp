blocks:
- type: topic_meta
- type: text
  body: Ein deutscher Akzent im Spanischen zeigt sich nicht nur an einzelnen Lauten. Manchmal sind es kleine, kaum bemerkte Unterschiede, die den Klang einer ganzen Äußerung verändern. Vier Hörvergleiche machen solche Feinheiten hörbar – und zeigen, wie man sie im Unterricht aufgreifen kann.
- type: audio_contrast
  title: 'Hörvergleich: *o hay*'
  lead: Was unterscheidet die beiden Aussprachen?
  transcript: '*o hay*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/o-hay-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/o-hay-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    In der Aussprache der Referenzsprecher:in werden die Vokale von *o hay* fließend miteinander verbunden: [o.ˈai]. In der Aussprache der lernenden Person zeigt sich dagegen ein typisches Merkmal des Deutschen: der **Knacklaut [ʔ]**, der häufig vor vokalisch beginnenden Wörtern und Silben auftritt. Durch die zusätzlichen Knacklaute [ʔo.ʔai] erhält die Wortfolge den oft als „hart“ oder „abgehackt“ beschriebenen Klang.
- type: section_heading
  title: Wie entsteht der Knacklaut?
- type: text
  body: Der Knacklaut [ʔ] entsteht durch einen kurzen Verschluss der Stimmlippen im Kehlkopf. Im Deutschen tritt er häufig vor vokalisch beginnenden Wörtern auf, etwa bei *die Ente* [diː ˈʔɛntə].
- type: image
  src: glottal-stop-larynx-hand.png
  alt: 'Zeichnung einer Frau im Halbprofil, die mit Daumen und Fingern leicht den Hals auf Höhe des Kehlkopfs berührt; der Bereich des Kehlkopfs ist violett hervorgehoben.'
  caption: 'Die Handhaltung veranschaulicht die Lage des Kehlkopfs, in dem der Knacklaut gebildet wird.'
  credit: 'Illustration: Felix Tacke (Konzept und Prompting), KI-generiert · Pronunciation Matters (2026)'
- type: section_heading
  title: Wo können Knacklaute bei Lernenden auftreten?
- type: text
  body: Im Deutschen beginnen auch vokalisch anlautende Silben häufig mit einem Knacklaut. Deutschsprachige Lernende übertragen dieses Muster mitunter auf das Spanische – besonders dort, wo zwei Vokale aufeinandertreffen. Das gilt sowohl **zwischen Wörtern** (*o hay*, *tiene hambre*) als auch **innerhalb eines Wortes**, etwa bei *reír*.
- type: audio_contrast
  title: 'Hörvergleich: *tiene hambre*'
  lead: Wie werden die Vokale an der Wortgrenze miteinander verbunden?
  transcript: '*tiene hambre*'
  examples:
  - role: reference
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · D27
    audio: corpus/p1-hambre-learner.mp3
- type: audio_contrast
  title: 'Hörvergleich: *reír*'
  lead: Wie wird der Übergang zwischen den beiden Vokalen realisiert?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Pronunciation Matters · W76
    audio: corpus/p1-reir-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · W76
    audio: corpus/p1-reir-learner.mp3
- type: section_heading
  title: Wenn Wortgrenzen verschwimmen
- type: text
  body: |-
    Im Spanischen werden nicht nur aufeinandertreffende Vokale fließend miteinander verbunden. Endet ein Wort auf einen Konsonanten und beginnt das nächste mit einem Vokal, wird der Konsonant normalerweise der folgenden Silbe zugeordnet. So wird aus *sus amigos* beim Sprechen **su‑sa‑mi‑gos**, aus *los otros* entsprechend **lo‑so‑tros**: Das auslautende /s/ bildet jeweils mit dem folgenden Vokal eine Silbe. Dieses Phänomen nennt man **Resilbifizierung** (spanisch: *resilabificación*).

    Deutschsprachige Lernende orientieren sich dagegen mitunter stärker an den einzelnen Wortgrenzen und sprechen die Wörter deutlicher voneinander getrennt aus. Auch dadurch kann ein „abgehackterer“ Höreindruck entstehen.
- type: audio_contrast
  title: 'Hörvergleich: *los otros*'
  lead: Wie werden *los* und *otros* miteinander verbunden?
  transcript: '¿Tampoco ***los otros*** quieren venir?'
  examples:
  - role: reference
    subtitle: Pronunciation Matters · QY5
    audio: corpus/p1-losotros-ref.mp3
  - role: learner
    subtitle: Pronunciation Matters · QY5
    audio: corpus/p1-losotros-learner.mp3
- type: section_heading
  title: 'Impulse für den Unterricht'
- type: text
  body: 'Die Hörvergleiche eignen sich, um die Aufmerksamkeit auf oft unbemerkte Unterschiede zwischen den Sprachen zu lenken und die phonetische Sprachbewusstheit zu schärfen.'
- type: teaching_impulses
  items:
  - title: 'Erst hören, dann erklären'
    body: 'Die Aufnahmen zunächst ohne Erklärung abspielen. Wo sind Unterbrechungen hörbar, wo werden Laute fließend verbunden? Die Beobachtungen gemeinsam sammeln und anschließend linguistisch einordnen.'
  - title: 'Aussprache bewusst erproben'
    body: 'Den deutschen Knacklaut etwa an *die Ente* bewusst artikulieren und mit *o hay* oder *tiene hambre* kontrastieren. Anschließend spanische Wortfolgen ohne zusätzlichen Knacklaut sprechen und an *los otros* oder *sus amigos* die Resilbifizierung erproben. Auch einfache, schrittweise erweiterte Äußerungen eignen sich dafür: *el amigo* → *el amigo de Ana* → *el amigo de Ana es alto*.'
  - title: 'Sprachen vergleichen'
    body: 'Den Blick auf weitere Fremdsprachen erweitern: Wie werden Wortgrenzen im Französischen, Italienischen oder Englischen realisiert? Wo treten glottale Neueinsätze auf, wo werden Laute verbunden? Solche Vergleiche machen unterschiedliche Aussprachemuster bewusst und fördern die sprachübergreifende Reflexion.'
