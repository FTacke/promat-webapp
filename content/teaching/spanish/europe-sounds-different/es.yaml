    text: Cómo las grafías familiares pueden influir en la pronunciación, por ejemplo la secuencia ⟨eu⟩ en *Europa* y *deuda*.
    cta: Más información
    href: https://linguistik.hispanistica.com/orthographie/#vokale
  - title: Español fluido, alemán entrecortado
    text: Cómo se enlazan con fluidez las vocales consecutivas en español y qué papel desempeña el golpe de glotis.
    cta: Página temática relacionada
