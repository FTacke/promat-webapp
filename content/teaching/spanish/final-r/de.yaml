blocks:
  - type: hero
    layout:
      span: 2
    title: Finales r
    lead: Wort- und silbenfinales r verlangt kontrollierte Hörziele im Kontext, nicht nur isolierte Artikulationsanweisungen.
  - type: section_heading
    layout:
      span: 2
    title: Ausgangspunkt
  - type: text
    layout:
      span: 1
    body: |
      Im Deutschen wird wortfinales r oft abgeschwächt, vokalisiert oder deutlich anders angebunden als im Spanischen.

      Für spanisches finales r sind deshalb kurze, rhythmische Kontexte meist hilfreicher als isolierte Lautbeschreibungen.
  - type: tip_box
    layout:
      span: 1
    title: Unterrichtsperspektive
    body: |
      Einstieg und Sicherung sollten vom Hören ausgehen: Was bleibt am Wortende hörbar, wie knapp ist der Auslaut, und wann kippt die Realisierung hörbar in eine deutsch geprägte Spur?

      Erst danach lohnt es sich, einzelne Artikulationshinweise knapp zu ergänzen.
  - type: audio_contrast
    layout:
      span: 2
    title: Kontrastive Beobachtung
    examples:
      - title: Spanisch-nah
        transcript: Das finale r bleibt hörbar und knapp.
      - title: Deutsch gefärbt
        transcript: Das finale r wird zu stark geöffnet oder abgeschwächt.
  - type: text
    layout:
      span: 1
    title: Didaktische Folgerung
    body: |
      Gute Aufgaben koppeln Hören und Sprechen eng: erst unterscheiden, dann in kurzen Wort- und Satzrahmen nachsprechen, schließlich im eigenen Rhythmus stabilisieren.

      So bleibt das Ziel konkret, ohne das finale r künstlich zu übertreiben.
