title: Finales r
description: Unterrichtsrohbau zum silben- und wortfinalen r mit Hörhinweisen, Download-Platzhalter und klaren Anschlusswegen.
equivalents:
  en: final-r
credits:
  coordinator:
    - name: PROMAT Teaching
      role: Koordination
      affiliation: PROMAT
  authors:
    - name: Felix Tacke
      role: Konzept
