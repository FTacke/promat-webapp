- type: section_heading
  title: Für den Unterricht
- type: tip_box
  title: 'Kurzaufgabe: Artikulationsvergleich'
  body: |-
    1. **[β]:** Die Lippen nähern sich einander, ohne sich zu schließen. *labio*, *lavar* sprechen.
    2. **[ð]:** Die Zungenspitze nähert sich den oberen Schneidezähnen, ohne sie zu berühren. *vida*, *cuidado* sprechen.
    3. **[ɣ]:** Der Zungenrücken nähert sich dem weichen Gaumen, ohne ihn zu berühren. *logro*, *algo* sprechen.

    Kontrolle im Spiegel oder mit einem Partner: Bei [β] bleibt zwischen den Lippen ein schmaler Spalt, bei [b] schließen sie sich. Danach die Wörter mit den Aufnahmen vergleichen.
