resource_id: promat-teaching-es-soft-consonants-b-d-g
title: 'b, d und g: Zu hart gesprochen?'
summary: Warum spanische b, d und g oft weicher klingen als im Deutschen – und wann sie es nicht tun.
description: Warum spanische b, d und g oft weicher klingen als im Deutschen – und wann sie es nicht tun.
equivalents:
  en: soft-consonants-b-d-g
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-19
blocks:
- type: topic_meta
- type: text
  body: |-
    Ein scheinbar vertrauter Konsonant kann im Spanischen ganz anders klingen: Bei b, d und g ist die Artikulation häufig weniger fest, als man es aus dem Deutschen kennt. Ein erster Hörvergleich macht den Unterschied hörbar.
- type: audio_contrast
  title: 'Hörvergleich: *vida*'
  lead: Was unterscheidet die Aussprache des *d*?
  transcript: '*vida*'
  examples:
  - role: reference
    subtitle: Mexiko · W45
    audio: corpus/p5-vida-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W45
    audio: corpus/p5-vida-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    In der Referenzaufnahme wird das *d* ohne vollständigen Verschluss gesprochen: [ˈbi.ða]. Die lernende Person spricht es dagegen mit einem erkennbaren Verschluss, wie im Deutschen: [ˈbi.da].
- type: section_heading
  title: Verschluss oder Annäherung?
- type: text
  body: |-
    Beim Verschlusslaut [d] berührt die Zungenspitze die oberen Zähne so, dass der Luftstrom kurz vollständig unterbrochen wird. Beim Approximanten [ð] nähert sie sich ihnen nur an: Es bleibt ein Durchlass, die Luft strömt weiter, meist ohne hörbare Reibung. Diesen Unterschied nehmen wir als „weich“ wahr.
- type: image
  src: dental-stop-approximant.png
  size: wide
  alt: 'Zwei schematische Seitenschnitte des Mundraums: links vollständiger Zungenverschluss bei [d], rechts angenäherte Zunge mit offenem Luftweg bei [ð].'
  caption: 'Zwei Realisierungen des spanischen /d/: Beim Verschlusslaut [d] wird der Luftstrom durch einen vollständigen Verschluss kurz unterbrochen. Beim Approximanten [ð] nähert sich die Zunge den oberen Zähnen nur an; die Luft kann weiterströmen.'
  credit: 'Illustration: Felix Tacke (Konzept und Prompting), KI-generiert · Pronunciation Matters (2026)'
- type: section_heading
  title: Auch b und g werden weich
- type: text
  body: |-
    Dasselbe Prinzip gilt auch für die spanischen Phoneme /b/ und /g/: Je nach Lautumgebung werden sie als Verschlusslaute [b, g] oder als Approximanten [β, ɣ] ausgesprochen. Besonders zwischen Vokalen ist die weichere Artikulation typisch – etwa in *lavar* [la.ˈβaɾ]. In *agua* steht das g zwischen [a] und dem Gleitlaut [w]: [ˈa.ɣwa].
- type: audio_contrast
  title: 'Hörvergleich: *lavar*'
  lead: Wie wird der Konsonant zwischen den beiden *a* ausgesprochen?
  transcript: '*lavar*'
  examples:
  - role: reference
    subtitle: Spanien · W9
    audio: corpus/p5-lavar-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W9
    audio: corpus/p5-lavar-learner.mp3
- type: audio_contrast
  title: 'Hörvergleich: *con agua*'
  lead: Wie wird das *g* in den beiden Aufnahmen ausgesprochen?
  transcript: '*con agua*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/agua-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/agua-learner.mp3
- type: audio_contrast
  title: 'Hörvergleich: *el bebedor*'
  lead: Welche Konsonanten klingen in der Referenzaufnahme weicher?
  transcript: '*el bebedor*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/bebedor-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/bebedor-learner.mp3
- type: text
  body: |-
    In *el bebedor* kommen drei Positionen zusammen: das erste b nach l, das zweite b zwischen Vokalen und das d zwischen Vokalen. In der Referenzaufnahme klingen alle drei weicher, schematisch [el.βe.βe.ˈðoɾ]; die lernende Person spricht sie dagegen mit deutlichem Verschluss. Die weichere Aussprache ist also nicht auf die Position zwischen Vokalen beschränkt.
- type: info_box
  title: Wann klingen b, d und g sonst noch weich?
  body: |-
    Zwischen Vokalen ist die weichere Aussprache besonders leicht zu beobachten, sie kommt aber auch in anderen Lautumgebungen vor: In *logro* und *regla* wird das g vor einem weiteren Konsonanten gewöhnlich als Approximant [ɣ] gesprochen, ebenso in *algo* nach l. Auch das erste b in *el bebedor* ist nach l typischerweise ein [β].

    Die Verteilung ist nicht für alle drei Phoneme gleich: Das d wird nach l gewöhnlich als Verschlusslaut [d] gesprochen (*caldo*), und nach einem Nasal sind b, d und g Verschlusslaute, etwa das g in *tengo* [ˈteŋ.go].

    **Für den Unterricht genügt zunächst die Faustregel: Zwischen Vokalen werden b, d und g im Spanischen meist ohne vollständigen Verschluss ausgesprochen.**
- type: section_heading
  title: Impulse für den Unterricht
- type: teaching_impulses
  items:
  - title: Erst hören, dann erklären
    body: Referenz- und Lernendenaufnahmen zunächst ohne Fachbegriffe vergleichen und gemeinsam beobachten, welche Konsonanten härter und welche weicher klingen.
  - title: Verschluss und Annäherung erproben
    body: Mit der Artikulationsgrafik den Unterschied zwischen vollständigem Verschluss und bloßer Annäherung zeigen und bei einfachen Wörtern wie *vida* die unterschiedliche Zungenbewegung bewusst ausprobieren.
  - title: Das Muster übertragen
    body: Von den einfachen Beispielen zu weiteren Kontexten gehen, etwa mit *el bebedor*, wo mehrere Positionen in einer Wortfolge zusammenkommen. Die Allophonie muss nicht vollständig behandelt werden – schon die Sensibilisierung für den Unterschied ist ein sinnvolles Ziel.
- type: further_reading
  title: Vertiefung
  description: Weiterführende Kapitel des digitalen Lehrbuchs und verwandte Themenseiten.
  items:
  - title: Aussprache im digitalen Lehrbuch
    text: Die kontextabhängige Aussprache von /b d g/ mit Hörbeispielen und Hinweisen für den Unterricht.
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/aussprache/#kontextabhangige-mal-so-mal-so-laute
  - title: Fehlerlinguistik im digitalen Lehrbuch
    text: Hintergrund zur systematischen Erklärung lernersprachlicher Aussprachemuster, etwa des Transfers aus der Erstsprache.
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/fehlerlinguistik/#transfer-aus-der-erstsprache
  - title: Weiches Spanisch, hartes Deutsch
    text: Der andere Mechanismus hinter dem „abgehackten“ Höreindruck – zusätzliche Knacklaute.
    cta: Zur Themenseite
    href: /de/teaching/spanish/soft-spanish-hard-german
  - title: B oder V? Wenn die Schrift mitredet
    text: Warum das spanische [β] kein [v] ist und welche Rolle die Schreibung dabei spielt.
    cta: Zur Themenseite
