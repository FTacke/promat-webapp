resource_id: promat-teaching-es-soft-consonants-b-d-g
title: 'Weiche Konsonanten: b, d und g'
summary: Warum /b/, /d/ und /g/ im Spanischen häufig ohne vollständigen Verschluss artikuliert werden.
description: Die Phoneme /b/, /d/ und /g/ und ihre Realisierungen als Verschlusslaute und Approximanten [β ð ɣ] – mit Hörvergleichen aus dem Korpus.
equivalents:
  en: soft-consonants-b-d-g
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: '*labio*, *cuidado*, *logro*: Die Buchstaben `b`, `d` und `g` stehen im Spanischen oft für Laute, bei denen der Verschluss nicht ganz zustande kommt. Der Laut klingt dadurch weicher als ein deutsches *b*, *d* oder *g*.'
- type: overview
  title: Auf einen Blick
  items:
  - '/b/, /d/ und /g/ haben je zwei kontextabhängige Realisierungen: Verschlusslaute [b d g] und Approximanten [β ð ɣ].'
  - Bei einem Approximanten nähern sich die Artikulationsorgane einander an, ohne einen vollständigen Verschluss zu bilden.
  - 'Die Verteilung unterscheidet sich zwischen den drei Phonemen: „zwischen Vokalen weich, sonst hart“ reicht als Regel nicht aus.'
- type: section_heading
  title: Hören und entdecken
- type: text
  body: Zwei Aufnahmen desselben Wortes. Hören Sie auf das `b` in der Wortmitte.
- type: audio_contrast
  title: '*labio*: Verschluss oder weicher Laut?'
  lead: Klingt das *b* in *labio* eher wie ein kurzer Knall oder eher wie ein weiches Reiben?
  transcript: labio
  examples:
  - label: Muttersprachliche Referenz
    subtitle: Spanien · W21
    audio: corpus/p5-labio-ref.mp3
    token_id: ES-N-0001 · W21
  - label: Lernende:r (B1)
    subtitle: L1 Deutsch · W21
    audio: corpus/p5-labio-learner.mp3
    token_id: ES-L-0013 · W21
- type: solution
  body: |-
    In *labio* steht /b/ zwischen Vokalen. Üblich ist dort der Approximant [β]: [ˈla.βjo]. Die Lippen nähern sich einander an, schließen sich aber nicht vollständig; es gibt keinen kleinen „Knall“, sondern ein weiches Reiben oder Summen.

    Bei einem vollständigen Verschluss [b] hören Sie dagegen einen kurzen Verschlusslösungsknall. Die Aufnahmen wurden nicht danach ausgewählt, ob sie den Unterschied zeigen – entscheiden Sie nach Gehör.
- type: section_heading
  title: Plosiv oder Approximant?
- type: text
  body: |-
    Jedes der drei Phoneme tritt in zwei Varianten auf:

    - **/b/:** [b] nach Pause und nach Nasal (*un beso*, *también*); sonst [β], auch nach /l/ und zwischen Vokalen (*lavar* [la.ˈβaɾ], *el vino* [el.ˈβi.no]).
    - **/d/:** [d] nach Pause, nach Nasal und nach /l/ (*dos*, *conde*, *toldo*); sonst [ð] (*vida* [ˈbi.ða], *cuidado* [kwi.ˈða.ðo], *verdad* [beɾ.ˈðað]).
    - **/g/:** [g] nach Pause und nach Nasal (*gato*, *tengo*); sonst [ɣ] (*logro* [ˈlo.ɣɾo], *algo* [ˈal.ɣo]).
- type: text
  body: 'Entscheidend ist die gesamte lautliche Umgebung, nicht allein die Wortposition. Ein Wort nach einer Pause beginnt mit [b], [d] oder [g]; derselbe Anlaut innerhalb einer Äußerung nach einem Vokal wird zu [β], [ð] oder [ɣ]: *vino* [ˈbi.no], aber *de vino* [de.ˈβi.no]. In schneller Rede sind Approximanten oft stark reduziert; besonders [ð] kann bis zum Schwund abgeschwächt werden (*cansado* [kan.ˈsa.o]). Wie die Regel im Einzelfall umgesetzt wird, schwankt mit Tempo, Betonung und Region.'
- type: info_box
  title: Zwei Dinge, die nicht dasselbe sind
  body: 'Dass `b` und `v` im Spanischen dasselbe Phonem schreiben, ist ein Thema der Orthographie ([B oder V?](/de/teaching/spanish/b-or-v)). Die hier beschriebene Weichheit betrifft die phonetische Realisierung: Sie hängt vom Kontext ab, nicht vom Buchstaben. Deutschsprachige Lernende sprechen /b d g/ häufig mit stärkeren Verschlüssen, als sie im jeweiligen spanischen Kontext üblich wären – das ist eine verbreitete Beobachtung, die an einzelnen Aufnahmen geprüft werden sollte.'
- type: section_heading
  title: Weitere Vergleiche aus dem Korpus
- type: text
  body: Dieselben Wörter und Sätze, gesprochen von einer muttersprachlichen Referenzaufnahme und von einer Lernendenaufnahme (Erstsprache Deutsch). Die Aufnahmen stammen aus den kontrollierten Wort- und Satzlisten von *Pronunciation Matters*; die Auswahl ist exemplarisch und beansprucht keine Repräsentativität.
