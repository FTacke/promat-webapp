resource_id: promat-teaching-es-soft-consonants-b-d-g
title: '*b*, *d* and *g*: Pronounced too hard?'
summary: 'Why Spanish *b*, *d* and *g* often sound softer than in German – and when they do not.'
description: 'Why Spanish *b*, *d* and *g* often sound softer than in German – and when they do not.'
equivalents:
  de: soft-consonants-b-d-g
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-19
blocks:
- type: topic_meta
- type: text
  body: |-
    A seemingly familiar consonant can sound quite different in Spanish: with b, d and g, the articulation is often less firm than with the corresponding German sounds. A first listening comparison makes the difference audible.
- type: audio_contrast
  title: 'Listening comparison: *vida*'
  lead: What distinguishes the pronunciation of the *d*?
  transcript: '*vida*'
  examples:
  - role: reference
    subtitle: Mexico · W45
    audio: corpus/p5-vida-ref.mp3
  - role: learner
    subtitle: L1 German · W45
    audio: corpus/p5-vida-learner.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    In the reference recording, the *d* is pronounced without a complete closure: [ˈbi.ða]. The learner, by contrast, produces it with an audible closure, as in German: [ˈbi.da].
- type: section_heading
  title: Closure or approximation?
- type: text
  body: |-
    With the stop [d], the tip of the tongue touches the upper teeth so that the airflow is briefly interrupted completely. With the approximant [ð], it merely approaches them: a passage remains, the air keeps flowing, usually without audible friction. This articulation is often perceived as “softer”.
- type: image
  src: dental-stop-approximant.png
  size: wide
  alt: 'Two schematic cross-sections of the oral cavity: on the left, a complete tongue closure for [d]; on the right, the tongue only approaching, leaving an open airway, for [ð].'
  caption: 'Two realisations of Spanish /d/: with the stop [d], the airflow is briefly interrupted by a complete closure. With the approximant [ð], the tongue only approaches the upper teeth; the air can keep flowing.'
  credit: 'Illustration: Felix Tacke (concept and prompting), AI-generated · Pronunciation Matters (2026)'
- type: section_heading
  title: b and g become soft, too
- type: text
  body: |-
    The same principle applies to the Spanish phonemes /b/ and /g/: depending on the sound environment, they are pronounced as stops [b, g] or as approximants [β, ɣ]. The softer articulation is especially typical between vowels – for instance in *lavar* [la.ˈβaɾ]. In *agua*, the g stands between [a] and the glide [w]: [ˈa.ɣwa].
- type: audio_contrast
  title: 'Listening comparison: *lavar*'
  lead: How is the consonant between the two *a* pronounced?
  transcript: '*lavar*'
  examples:
  - role: reference
    subtitle: Spain · W9
    audio: corpus/p5-lavar-ref.mp3
  - role: learner
    subtitle: L1 German · W9
    audio: corpus/p5-lavar-learner.mp3
- type: audio_contrast
  title: 'Listening comparison: *con agua*'
  lead: How is the *g* pronounced in the two recordings?
  transcript: '*con agua*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/agua-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/agua-learner.mp3
- type: section_heading
  title: Several approximants in one word sequence
- type: text
  body: |-
    In connected speech, several approximants can follow one another – and they are not limited to the position between vowels.
- type: audio_contrast
  title: 'Listening comparison: *el bebedor*'
  lead: 'The word sequence shows three approximant realisations: [β] after /l/ and between vowels, and [ð] between vowels.'
  transcript: '*el bebedor*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/bebedor-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/bebedor-learner.mp3
- type: text
  body: |-
    In the reference recording, all three sound softer, schematically [el.βe.βe.ˈðoɾ]; the learner, by contrast, pronounces them with a distinct closure.
- type: info_box
  title: When else do b, d and g sound soft?
  body: |-
    The softer pronunciation is easiest to observe between vowels, but it also occurs in other sound environments: in *logro* and *regla*, the g before another consonant is usually pronounced as the approximant [ɣ], and so it is in *algo* after l. The first b in *el bebedor* is typically a [β] as well, after l.

    The distribution is not the same for all three phonemes: d is usually pronounced as the stop [d] after l (*caldo*), and after a nasal, b, d and g are stops, for instance the g in *tengo* [ˈteŋ.go].

    **As a first orientation: between vowels, b, d and g in Spanish are usually pronounced without a complete closure.**
- type: section_heading
  title: Classroom prompts
- type: teaching_impulses
  items:
  - title: Listen first, explain later
    body: First compare the reference and learner recordings without technical terms and observe together which consonants sound harder and which softer.
  - title: Try out closure and approximation
    body: Use the articulation diagram to show the difference between a complete closure and mere approximation, and consciously try out the different tongue movement with simple words such as *vida*.
  - title: Transfer the pattern
    body: Move from the simple examples to further contexts, for instance with *el bebedor*, where several positions come together in one word sequence. Allophony does not have to be covered completely – raising awareness of the difference is already a worthwhile goal.
