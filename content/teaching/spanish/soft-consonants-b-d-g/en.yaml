- type: section_heading
  title: For the classroom
- type: tip_box
  title: 'Quick task: comparing articulations'
  body: |-
    1. **[β]:** the lips approach each other without closing. Say *labio*, *lavar*.
    2. **[ð]:** the tongue tip approaches the upper front teeth without touching them. Say *vida*, *cuidado*.
    3. **[ɣ]:** the back of the tongue approaches the soft palate without touching it. Say *logro*, *algo*.

    Check in a mirror or with a partner: for [β] a narrow gap remains between the lips, for [b] they close. Then compare the words with the recordings.
