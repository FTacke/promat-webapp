    cta: Más información
    href: https://linguistik.hispanistica.com/fehlerlinguistik/#transfer-aus-der-erstsprache
  - title: Español fluido, alemán entrecortado
    text: 'Otro mecanismo que puede producir una impresión de habla «entrecortada»: la inserción de golpes de glotis.'
    cta: Página temática relacionada
    href: /de/teaching/spanish/es/soft-spanish-hard-german
  - title: ¿B o V? Cuando la escritura se hace oír
    text: Por qué la aproximante española [β] no es [v] y qué papel desempeña la grafía.
    cta: Página temática relacionada
    href: /de/teaching/spanish/es/b-or-v
