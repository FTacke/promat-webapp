- type: section_heading
  title: Für den Unterricht
- type: tip_box
  title: 'Kurzaufgabe: Hörzuordnung und Schriftbild'
  body: |-
    1. Die Lehrkraft spricht *bienes* oder *vienes* (ohne Schriftbild); die Lernenden notieren, welches Wort sie gehört haben – und merken, dass das nicht möglich ist.
    2. Die Schreibweisen werden aufgedeckt. Gemeinsam wird besprochen: Warum haben wir `v` als [v] erwartet?
    3. Weitere Paare wie *barón* – *varón* oder *botar* – *votar* zeigen: Nur der Kontext verrät das gemeinte Wort.
- type: further_reading
  title: Vertiefung
  description: Weiterführende Seiten zu b/v und zur Lautvariation.
  items:
  - title: 'Weiche Konsonanten: b, d und g'
    text: Wann /b/ als [b] und wann als [β] gesprochen wird – dazu [ð] und [ɣ].
    cta: Zur Themenseite
    href: /de/teaching/spanish/soft-consonants-b-d-g
  - title: 'Fehlerlinguistik: Einfluss des Schriftbilds'
    text: Wie Lernende Schrift-Laut-Zuordnungen aus der Erstsprache übertragen, am Beispiel von `v` in *vivir*.
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/fehlerlinguistik/#einfluss-des-schriftbilds
  - title: 'Orthographie: b und v'
    text: Warum die Unterscheidung von `b` und `v` nicht systematisch ableitbar ist.
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/orthographie/#unsystematische-alternanzen-b-vs-v
