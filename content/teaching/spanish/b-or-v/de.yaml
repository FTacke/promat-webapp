resource_id: promat-teaching-es-b-or-v
title: '*B* oder *V*? Wenn die Schrift mitredet'
summary: Warum zwei spanische Buchstaben denselben Laut bezeichnen – und die Schrift dennoch zu unterschiedlichen Aussprachen verleiten kann.
description: Warum zwei spanische Buchstaben denselben Laut bezeichnen – und die Schrift dennoch zu unterschiedlichen Aussprachen verleiten kann.
equivalents:
  en: b-or-v
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-28
blocks:
- type: topic_meta
- type: text
  body: Im Spanischen stehen ⟨b⟩ und ⟨v⟩ für dasselbe Phonem /b/. In anderen Sprachen, etwa im Deutschen, haben die Buchstaben unterschiedliche Lautwerte. Diese aus dem Deutschen vertraute Unterscheidung wird von deutschsprachigen Lernenden häufig unbewusst auf das Spanische übertragen, wie die Hörvergleiche zeigen.
- type: audio_contrast
  title: 'Hörvergleich: *bienes – vienes*'
  lead: Was fällt bei den Anlauten von *bienes* und *vienes* auf?
  transcript: '*bienes – vienes*'
  examples:
  - role: reference
    subtitle: Mexiko · W92
    audio: corpus/p4-bienes-ref-mx.mp3
  - role: reference
    subtitle: Chile · W92
    audio: corpus/p4-bienes-ref-cl.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    Beide Referenzsprecher:innen sprechen *bienes* („Güter“) und *vienes* („du kommst“, von *venir*) gleich aus: [ˈbje.nes]. Die Wörter sind Homophone – ohne Kontext lässt sich nicht erkennen, welches gemeint ist.
- type: section_heading
  title: Zwei Buchstaben, ein Laut
- type: text
  body: |-
    Die Schreibungen ⟨b⟩ und ⟨v⟩ gehen auf lateinische Wörter mit *b* und *v* zurück (*beber* < lat. *bibere*, *vivir* < lat. *vivere*). Im Spanischen ist ihre Aussprache zusammengefallen: Beide Buchstaben stehen für das Phonem /b/. Welche Schreibung ein Wort hat, lässt sich deshalb nicht hören, sondern muss wortweise gelernt werden – auch bei Paaren wie *barón* – *varón* oder *botar* – *votar*.
- type: text
  body: '**⟨b⟩ / ⟨v⟩ → /b/**'
- type: info_box
  title: Zwei Buchstaben, ein Laut – auch Erstsprachler:innen sind manchmal unsicher
  body: |-
    Auch in der spanischen Sprachgemeinschaft hält sich mitunter die Vorstellung, ⟨v⟩ stehe „eigentlich“ für ein /v/. Gestützt wurde sie historisch durch normative Darstellungen: Orthographische Abhandlungen der Real Academia Española vertraten sie noch bis ins 20. Jahrhundert, von dort gelangte sie in Schulbücher. Wer sich beim Sprechen bewusst an der Schrift orientiert, kann deshalb ein vermeintlich korrekteres [v] sprechen; dies ist ein Beispiel für *spelling pronunciation*, also eine von der Schrift beeinflusste Aussprache.
- type: section_heading
  title: Wenn zwei Buchstaben zu zwei Lauten werden
- type: text
  body: 'Die Erwartung, verschiedene Buchstaben müssten verschiedene Laute bezeichnen, ist aus anderen Sprachen vertraut – und sie kann die Aussprache lenken. Ein Beispiel:'
- type: audio_contrast
  title: 'Hörvergleich: *barón – varón*'
  lead: Unterscheidet sich der Anlaut der beiden Wörter in den Aufnahmen?
  transcript: '*barón – varón*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/baron-varon-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/baron-varon-learner.mp3
- type: text
  body: 'Die Referenzsprecher:in spricht *barón* und *varón* gleich aus: [baˈɾon]. In der Aufnahme der lernenden Person erhält *varón* dagegen einen eigenen Anlaut: [vaˈʁon] statt [baˈʁon]. Hier folgt die Aussprache der Schrift – ein Fall von *spelling pronunciation*.'
- type: audio_contrast
  title: 'Hörvergleich: *bienes – vienes*'
  lead: Wie wird das *v* in *vienes* ausgesprochen?
  transcript: '*bienes – vienes*'
  examples:
  - role: reference
    subtitle: Mexiko · W92
    audio: corpus/p4-bienes-ref-mx.mp3
  - role: learner
    subtitle: L1 Deutsch · W92
    audio: corpus/p4-bienes-learner.mp3
- type: text
  body: 'Welcher Laut tatsächlich zu hören ist, hängt übrigens nicht vom Buchstaben ab, sondern vom Kontext: Das Phonem /b/ wird nach Pause oder Nasal meist als Verschlusslaut [b] gesprochen, sonst als Approximant [β] – *vino* [ˈbi.no], aber *de vino* [de.ˈβi.no]. Mehr dazu auf der Themenseite [*b*, *d* und *g*: Zu hart ausgesprochen?](/de/teaching/spanish/soft-consonants-b-d-g).'
- type: section_heading
  title: Impulse für den Unterricht
- type: teaching_impulses
  items:
  - title: Erst hören, dann lesen
    body: Wörter wie *bienes* und *vienes* zunächst ohne sichtbares Schriftbild vorspielen. Anschließend die Schreibungen aufdecken und besprechen, welche Lautung man aufgrund der Schrift erwartet hätte.
  - title: Die Schrift bewusst hinterfragen
    body: Anhand von *bienes – vienes* und *barón – varón* zeigen, dass verschiedene Buchstaben nicht automatisch verschiedene Laute bedeuten – und überlegen, wie Aussprachen entstehen, die der Schrift folgen (*spelling pronunciation*).
  - title: Auch beim Schreiben entstehen Schwierigkeiten
    body: Die Gegenrichtung aufgreifen. Klingen zwei Buchstaben gleich, muss die Schreibung wortweise gelernt werden. Zur Veranschaulichung hilft ein Vergleich mit dem Deutschen, etwa die kindliche Fehlschreibung *Fater* statt *Vater* (als Beispiel gedacht, nicht als empirischer Befund). Im Spanischen bietet sich *tubo* / *tuvo* an, sofern der Wortschatz zur Gruppe passt.
- type: further_reading
  title: Vertiefung
  description: Weiterführende Kapitel des digitalen Lehrbuchs und der wissenschaftliche Hintergrund.
  items:
  - title: Orthographie im digitalen Lehrbuch
    text: Warum ⟨b⟩ und ⟨v⟩ nicht systematisch ableitbar sind – mit den Hörbeispielen *barón* und *varón*.
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/orthographie/#unsystematische-alternanzen-b-vs-v
  - title: Fehlerlinguistik im digitalen Lehrbuch
    text: Wie die Annahme, Buchstaben müssten Laute abbilden, Aussprachefehler erklärt (Schriftbildinterferenz).
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/fehlerlinguistik/#einfluss-des-schriftbilds
  - title: Aussprache im digitalen Lehrbuch
    text: Wie /b/ je nach Kontext als [b] oder [β] gesprochen wird.
    cta: Mehr erfahren
    href: https://linguistik.hispanistica.com/aussprache/#kontextabhangige-mal-so-mal-so-laute
  - title: 'Tacke (2020): Spanish: Orthography and Orthoepy'
    text: Wissenschaftlicher Beitrag zu Orthographie, Orthoepie und *spelling pronunciation* im Spanischen, in *Manual of Standardization in the Romance Languages* (De Gruyter).
    cta: Zur Publikation
    href: https://doi.org/10.1515/9783110458084-025
