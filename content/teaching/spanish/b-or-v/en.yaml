resource_id: promat-teaching-es-b-or-v
title: B or V? In Spanish, they sound the same!
summary: Why the letters `b` and `v` represent the same phoneme in Spanish – and why spelling can mislead learners.
description: 'The graphemes <b> and <v> stand for the same phoneme /b/ in Spanish: homophony, spelling interference and listening comparisons from the corpus.'
equivalents:
  de: b-or-v
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: '*bienes* or *vienes*? In German, `b` and `v` stand for different sounds – in Spanish they do not. Both letters write the same phoneme /b/. Anyone who pronounces a Spanish `v` like the German *w* in *Wasser* is following the spelling, not Spanish pronunciation.'
- type: overview
  title: At a glance
  items:
  - The graphemes <b> and <v> represent the same phoneme /b/ in Spanish.
  - '*bienes* and *vienes* are spelled differently and mean different things, but sound the same (homophones).'
  - How /b/ is pronounced depends on the phonetic context ([b] or [β]) – not on whether `b` or `v` is written.
- type: section_heading
  title: Listen and discover
- type: text
  body: Two recordings of the same pair of words, without the written form. Do you hear a difference between the first and the second word?
- type: audio_contrast
  title: Two words – any difference?
  lead: Do you hear a difference between the first and the second word?
  examples:
  - label: Native-speaker reference
    subtitle: Mexico · W92
    audio: corpus/p4-bienes-ref.mp3
    token_id: ES-N-0004 · W92
  - label: Learner (A2)
    subtitle: L1 German · W92
    audio: corpus/p4-bienes-learner.mp3
    token_id: ES-L-0017 · W92
- type: solution
  body: |-
    The words spoken are *bienes* (“goods”) and *vienes* (“you come”, from *venir*). In ordinary Spanish pronunciation the two words are homophones: [ˈbje.nes]. The difference lies in spelling alone – without context, the pronunciation does not reveal which word is meant.

    If you heard a fricative, labiodental sound [v] (as in German *Wasser*) in *vienes* in either recording, that would be a spelling pronunciation. This is not the case in every learner recording.
- type: section_heading
  title: Keeping spelling, phoneme and sound apart
- type: text
  body: |-
    Three levels need to be kept apart:

    - **Orthography:** Spanish writes `b` and `v`. The distinction rests on word history (Latin *b* and *v*) and cannot be predicted systematically; hence homophone pairs such as *barón* – *varón* and *botar* – *votar*.
    - **Phonology:** There is only one phoneme /b/. A contrast /b/ – /v/ does not exist in standard Spanish.
    - **Phonetics:** /b/ is pronounced as the stop [b] after a pause and after a nasal, otherwise as the approximant [β] (the lips approach each other without closing): *vino* [ˈbi.no], but *de vino* [de.ˈβi.no]. This alternation is independent of spelling.
- type: text
  body: 'German-speaking learners know `v` as [f] (*Vater*) or [v] (*Vase*). Transferring this familiar letter-sound mapping to Spanish leads to [v] instead of [b] or [β]. Even [β] never sounds like [v]: it is bilabial, whereas for [v] the upper teeth touch the lower lip.'
- type: info_box
  title: A note on variation
  body: In standard Spanish `b` and `v` coincide. Occasionally, bilingual speakers, for example with Catalan or Valencian, also distinguish the two sounds in Spanish. This is a matter of language contact and not a pronunciation norm for the classroom.
- type: section_heading
  title: More comparisons from the corpus
- type: text
  body: The same words and sentences, spoken by a native-speaker reference recording and by a learner recording (first language German). The recordings come from the controlled word and sentence lists of *Pronunciation Matters*; the selection is illustrative and makes no claim to be representative.
