- type: section_heading
  title: For the classroom
- type: tip_box
  title: 'Quick task: matching by ear, then by spelling'
  body: |-
    1. The teacher says *bienes* or *vienes* (without showing the spelling); learners note which word they heard – and notice that this cannot be done.
    2. The spellings are revealed. Discuss together: why did we expect `v` to be [v]?
    3. Further pairs such as *barón* – *varón* or *botar* – *votar* show that only context reveals the intended word.
