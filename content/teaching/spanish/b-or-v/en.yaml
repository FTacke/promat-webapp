resource_id: promat-teaching-es-b-or-v
title: B or V? When spelling has a say
summary: Why two Spanish letters stand for the same sound – and why spelling can still prompt different pronunciations.
description: Why two Spanish letters stand for the same sound – and why spelling can still prompt different pronunciations.
equivalents:
  de: b-or-v
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-19
blocks:
- type: topic_meta
- type: text
  body: In Spanish, ⟨b⟩ and ⟨v⟩ stand for the same phoneme /b/. In other languages, such as German, the two letters have different sound values. German-speaking learners often transfer this familiar distinction to Spanish without noticing, as the listening comparisons show.
- type: audio_contrast
  title: 'Listening comparison: *bienes – vienes*'
  lead: What stands out about the initial sounds of *bienes* and *vienes*?
  transcript: '*bienes – vienes*'
  examples:
  - role: reference
    subtitle: Mexico · W92
    audio: corpus/p4-bienes-ref-mx.mp3
  - role: reference
    subtitle: Chile · W92
    audio: corpus/p4-bienes-ref-cl.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    Both reference speakers pronounce *bienes* (“goods”) and *vienes* (“you come”, from *venir*) alike: [ˈbje.nes]. The words are homophones – without context there is no telling which one is meant.
- type: section_heading
  title: Two letters, one sound
- type: text
  body: |-
    The spellings ⟨b⟩ and ⟨v⟩ go back to Latin words with *b* and *v* (*beber* < Lat. *bibere*, *vivir* < Lat. *vivere*). In Spanish, their pronunciation has merged: both letters stand for the phoneme /b/. Which spelling a word has can therefore not be heard but has to be learned word by word – even for pairs such as *barón* – *varón* or *botar* – *votar*.
- type: text
  body: '**⟨b⟩ / ⟨v⟩ → /b/**'
- type: info_box
  title: Two letters, one sound – even native speakers are sometimes unsure
  body: |-
    Within the Spanish-speaking community, too, the idea persists that ⟨v⟩ “actually” stands for a /v/. It was historically supported by normative accounts: orthographic treatises of the Real Academia Española maintained it well into the 20th century, and from there it found its way into school textbooks. Anyone who consciously follows the spelling when speaking may therefore produce a supposedly more correct [v] – a vivid example of *spelling pronunciation* (cf. Tacke 2020).
- type: section_heading
  title: When two letters become two sounds
- type: text
  body: 'The expectation that different letters must denote different sounds is familiar from other languages – and it can guide pronunciation. One example:'
- type: audio_contrast
  title: 'Listening comparison: *barón – varón*'
  lead: Does the initial sound of the two words differ in the recordings?
  transcript: '*barón – varón*'
  examples:
  - role: reference
    subtitle: MAR.ELE
    audio: marele/baron-varon-ref.mp3
  - role: learner
    subtitle: MAR.ELE
    audio: marele/baron-varon-learner.mp3
- type: text
  body: 'The reference speaker pronounces *barón* and *varón* alike: [baˈɾon]. In the learner’s recording, by contrast, *varón* gets a sound of its own: [vaˈʁon] instead of [baˈʁon]. Here the pronunciation follows the spelling – a case of *spelling pronunciation*.'
- type: audio_contrast
  title: 'Listening comparison: *bienes – vienes*'
  lead: How is the *v* in *vienes* pronounced?
  transcript: '*bienes – vienes*'
  examples:
  - role: reference
    subtitle: Mexico · W92
    audio: corpus/p4-bienes-ref-mx.mp3
  - role: learner
    subtitle: L1 German · W92
    audio: corpus/p4-bienes-learner.mp3
- type: text
  body: 'Which sound is actually heard does not depend on the letter, by the way, but on the context: after a pause or a nasal, the phoneme /b/ is usually realised as the stop [b], elsewhere as the approximant [β] – *vino* [ˈbi.no], but *de vino* [de.ˈβi.no]. More on this on the topic page [b, d and g: Pronounced too hard?](/en/teaching/spanish/soft-consonants-b-d-g).'
- type: section_heading
  title: Classroom prompts
- type: teaching_impulses
  items:
  - title: Listen first, then read
    body: Play words such as *bienes* and *vienes* first without showing the spelling. Then reveal the spellings and discuss which pronunciation the spelling would lead one to expect.
  - title: Question the spelling consciously
    body: Use *bienes – vienes* and *barón – varón* to show that different letters do not automatically mean different sounds – and consider how pronunciations that follow the spelling arise (*spelling pronunciation*).
  - title: Writing causes difficulties too
    body: Take up the reverse direction. If two letters sound the same, the spelling has to be learned word by word. A comparison with German can illustrate this, for example the child’s misspelling *Fater* instead of *Vater* (meant as an illustration, not as an empirical finding). In Spanish, *tubo* / *tuvo* is an option, provided the vocabulary suits the group.
- type: further_reading
  title: Further exploration
  description: Further chapters of the digital textbook and the scholarly background.
  items:
  - title: Orthography in the digital textbook
    text: Why ⟨b⟩ and ⟨v⟩ cannot be derived systematically – with the audio examples *barón* and *varón* (in German).
    cta: Learn more
    href: https://linguistik.hispanistica.com/orthographie/#unsystematische-alternanzen-b-vs-v
  - title: Error linguistics in the digital textbook
    text: How the assumption that letters must represent sounds explains pronunciation errors (spelling interference; in German).
    cta: Learn more
    href: https://linguistik.hispanistica.com/fehlerlinguistik/#einfluss-des-schriftbilds
  - title: Pronunciation in the digital textbook
    text: How /b/ is pronounced as [b] or [β] depending on context (in German).
    cta: Learn more
    href: https://linguistik.hispanistica.com/aussprache/#kontextabhangige-mal-so-mal-so-laute
