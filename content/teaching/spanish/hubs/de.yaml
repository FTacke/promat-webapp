title: "Spanisch: Themenseiten"
overview_intro: Die Themenseiten bieten Orientierung zur Vermittlung der Aussprache des Spanischen und fokussieren jeweils ein spezifisches Phänomen, das im Unterricht in etwa 10–15 Minuten thematisiert werden kann. Sie sind für Lehrkräfte gedacht, die der Aussprache der Lernenden gezielt Aufmerksamkeit widmen möchten, und bieten Hörbeispiele, weiteres Anschauungsmaterial sowie konkrete Unterrichtsimpulse.
groups:
  - title: Grundlagen
    description: Orientierung zu Varianten, Normen und didaktischen Entscheidungen im Unterricht.
    topics:
      - which-pronunciation
      - soft-spanish-hard-german
  - title: Laute und Artikulation
    description: Konkrete Aussprachethemen mit Beispielen und Unterrichtsimpulsen.
    topics:
      - r
      - final-r