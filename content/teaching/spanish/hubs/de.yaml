title: "Spanisch: Themenseiten"
overview_intro: Die Themenseiten bündeln fachliche Orientierung, Hörbeispiele und Unterrichtsimpulse zu einzelnen Aussprachephänomenen im Spanischunterricht.
overview_note: '**Aussprache von Anfang an:** Die bewusste Wahrnehmung und Übung fremdsprachlicher Aussprache sollte bereits auf den ersten Lernniveaus beginnen. Viele der hier vorgestellten Phänomene lassen sich schon ab A1 behandeln, sofern Wortschatz und sprachliche Komplexität der Beispiele entsprechend angepasst werden.'
groups:
  - title: Grundlagen
    description: Orientierung zu Aussprachemodellen, Variation und didaktischen Entscheidungen im Unterricht.
    topics:
      - which-pronunciation
      - soft-spanish-hard-german
  - title: Laute und Artikulation
