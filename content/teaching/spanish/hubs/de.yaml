title: "Spanisch: Themenseiten"
overview_intro: Die Themenseiten bieten fachliche Orientierung, Hörbeispiele und Anregungen für kurze Ausspracheimpulse im Spanischunterricht. Oft genügen dafür zehn Minuten zwischendurch – und viele Phänomene lassen sich mit passenden Beispielen schon ab A1 aufgreifen.
groups:
  - title: Grundlagen
    description: Orientierung zu Aussprachemodellen, Variation und didaktischen Entscheidungen im Unterricht.
    topics:
      - which-pronunciation
      - soft-spanish-hard-german
  - title: Laute und Artikulation
    description: Aussprachethemen mit Beispielen und Unterrichtsimpulsen.
    topics:
      - r
      - r-am-silbenende
      - b-or-v
      - soft-consonants-b-d-g
      - accent-changes-everything
