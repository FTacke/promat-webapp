title: "Spanish: Topic pages"
overview_intro: The topic pages offer linguistic guidance, listening examples, and ideas for short pronunciation activities in Spanish lessons. Often, just ten minutes here and there are enough – and many of these features can be introduced as early as A1 with suitable examples.
groups:
  - title: Basics
    description: Orientation to pronunciation models, variation, and classroom pragmatics.
    topics:
      - which-pronunciation
      - soft-spanish-hard-german
  - title: Sounds and articulation
    description: Pronunciation topics with examples and classroom prompts.
    topics:
      - r
      - r-am-silbenende
      - b-or-v
      - soft-consonants-b-d-g
      - accent-changes-everything
