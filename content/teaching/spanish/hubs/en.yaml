title: "Spanish: Topic pages"
overview_intro: The topic pages combine subject-specific guidance, audio examples, and teaching prompts on individual pronunciation phenomena in Spanish teaching.
overview_note: '**Pronunciation from the start:** Conscious perception and practice of foreign-language pronunciation should begin at the very first levels of learning. Many of the phenomena presented here can be addressed as early as A1, provided the vocabulary and linguistic complexity of the examples are adapted accordingly.'
groups:
  - title: Basics
    description: Orientation to pronunciation models, variation, and classroom pragmatics.
    topics:
      - which-pronunciation
      - soft-spanish-hard-german
  - title: Sounds and articulation
    description: Pronunciation topics with examples and classroom prompts.
    topics:
      - r
      - r-am-silbenende
      - b-or-v
      - soft-consonants-b-d-g
      - accent-changes-everything
