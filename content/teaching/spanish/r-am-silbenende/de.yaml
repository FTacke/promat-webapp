  en: r-am-silbenende
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-19
blocks:
- type: topic_meta
- type: text
  body: Im Deutschen klingt das r am Wortende oft kaum noch wie ein Konsonant – im Spanischen bleibt es ein eigener, hörbarer Laut.
- type: audio_contrast
  title: 'Hörvergleich: *flor*'
  lead: Wie klingt das *r* am Wortende in den beiden Aufnahmen?
  transcript: '*flor*'
  examples:
  - role: reference
    subtitle: Spanien · W16
    audio: corpus/p3-flor-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W16
    audio: corpus/p3-flor-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    In der Aufnahme der Referenzsprecher:in endet *flor* mit einem kurzen Zungenschlag am Zahndamm: [ˈfloɾ]. Die lernende Person lässt das Wort dagegen ohne erkennbaren Zungenkontakt vokalisch ausklingen, etwa [ˈfloɐ̯] – so, wie man es vom deutschen r am Wortende kennt.
- type: section_heading
  title: Wenn das deutsche r zum Vokal wird
- type: text
  body: |-
    Im Standarddeutschen gehört die Vokalisierung von /r/ zur regulären Aussprache, etwa in *sehr*, *Vater* oder *Lehrer*. Dabei sind zwei Fälle zu unterscheiden: Nach dem langen Vokal in *sehr* klingt das r nur noch als Ausklang mit, etwa [zeːɐ̯]. In den unbetonten Endungen von *Vater* und *Lehrer* steht an seiner Stelle der Vokal [ɐ], das sogenannte Vater-Schwa (auch Tiefschwa): [ˈfaːtɐ], [ˈleːʁɐ]. Beide Erscheinungen sind verwandt, aber nicht in jeder Hinsicht identisch.
- type: text
  body: |-
    Das Spanische verhält sich anders. Am Wortende bleibt das r gewöhnlich konsonantisch, meist als kurzer Zungenschlag [ɾ]: *flor* [ˈfloɾ]. Regional und je nach Kontext kann die Realisierung schwächer, länger oder anders ausfallen, bleibt aber in der Regel ein Konsonant. Wer die deutsche Gewohnheit überträgt, spricht *flor* eher wie [ˈfloɐ̯].
- type: audio_contrast
  title: 'Hörvergleich: *lavar*'
  lead: Wie wird das auslautende *r* in den beiden Aufnahmen realisiert?
  transcript: '*lavar*'
  examples:
