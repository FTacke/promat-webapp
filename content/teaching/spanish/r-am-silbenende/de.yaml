- type: section_heading
  title: Für den Unterricht
- type: tip_box
  title: 'Kurzaufgabe: konsonantisch enden'
  body: |-
    1. Die Lernenden sprechen Wörter mit finalem r nach (*flor*, *reír*, *lavar*, *cuidar*) und beenden sie mit einem kurzen Zungenkontakt – ohne zusätzlichen Vokal am Ende.
    2. Danach sprechen sie *cuidar un perro* als zusammenhängende Lautfolge und achten darauf, wohin das r wandert.

    Leitfrage: Spüren Sie die Zungenspitze am Zahndamm, bevor der nächste Vokal beginnt?
