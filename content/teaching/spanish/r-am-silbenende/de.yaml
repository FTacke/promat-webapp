- type: section_heading
  title: Wenn auf das r ein Konsonant folgt
- type: text
  body: Die deutsche R-Vokalisierung und ihre mögliche Übertragung betreffen nicht nur den absoluten Wortauslaut, sondern häufig auch ein r am Ende einer Silbe – selbst im Wortinneren. In *enfermo* steht das r vor dem *m*, im Spanischen meist als kurzer Zungenschlag [en.ˈfeɾ.mo]; vokalisiert klänge das Wort etwa wie [en.ˈfeɐ̯.mo]. Gemeinsam ist *flor* und *enfermo* die Silbenendposition des r.
- type: audio_contrast
  title: 'Hörvergleich: *enfermo*'
  lead: Wie klingt das *r* vor *m* in den beiden Aufnahmen?
  transcript: '*enfermo*'
  examples:
  - role: reference
    subtitle: Mexiko · W50
    audio: corpus/p3-enfermo-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W50
    audio: corpus/p3-enfermo-learner.mp3
- type: section_heading
  title: 'Besonders knifflig: r am Anfang und am Ende'
- type: text
  body: |-
    *Reír* bringt beides zusammen. Im Spanischen beginnt das Wort mit einem mehrfach geschlagenen r und endet mit einem Zungenschlag: [re.ˈiɾ]. Deutschsprachige Lernende übertragen hier mitunter gleich zwei Gewohnheiten: ein hinteres [ʁ] am Wortanfang und die Vokalisierung am Wortende, etwa [ʁe.ˈɪɐ].

    Aus einem anderen Blickwinkel – dem Knacklaut zwischen den beiden Vokalen – kommt *reír* auch auf der Themenseite [Weiches Spanisch, hartes Deutsch](/de/teaching/spanish/soft-spanish-hard-german) vor. Hier geht es allein um das r.
- type: audio_contrast
  title: 'Hörvergleich: *reír*'
  lead: Wie klingen das *r* am Wortanfang und das *r* am Wortende in den beiden Aufnahmen?
  transcript: '*reír*'
