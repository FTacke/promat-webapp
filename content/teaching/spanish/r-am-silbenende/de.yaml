resource_id: promat-teaching-es-r-am-silbenende
title: Das r am Wortende
summary: Warum das r am Wortende im Spanischen anders klingt als im Deutschen.
description: Warum das r am Wortende im Spanischen anders klingt als im Deutschen.
equivalents:
  en: r-am-silbenende
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-19
blocks:
- type: topic_meta
- type: text
  body: Im Deutschen klingt das r am Wortende oft kaum noch wie ein Konsonant – im Spanischen bleibt es ein eigener, hörbarer Laut. Der erste Hörvergleich zeigt, was damit gemeint ist.
- type: audio_contrast
  title: 'Hörvergleich: *flor*'
  lead: Was unterscheidet die Aussprache am Ende des Wortes?
  transcript: '*flor*'
  examples:
  - role: reference
    subtitle: Spanien · W16
    audio: corpus/p3-flor-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W16
    audio: corpus/p3-flor-learner.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    In der Aufnahme der Referenzsprecher:in endet *flor* mit einem kurzen Zungenschlag am Zahndamm: [ˈfloɾ]. Die lernende Person lässt das Wort dagegen ohne erkennbaren Zungenkontakt vokalisch ausklingen, etwa [ˈfloɐ̯] – so, wie man es vom deutschen r am Wortende kennt.
- type: section_heading
  title: Wenn das deutsche r zum Vokal wird
- type: text
  body: |-
    Im Standarddeutschen ist das kein Fehler, sondern der Normalfall: Nach Vokalen wird /r/ häufig vokalisiert. In *sehr* klingt das r nach dem langen Vokal nur noch als Ausklang mit, etwa [zeːɐ̯]. In unbetonten Endungen wie in *Vater* und *Lehrer* steht an seiner Stelle der Vokal [ɐ], das sogenannte Vater-Schwa (auch Tiefschwa): [ˈfaːtɐ], [ˈleːʁɐ]. Beide Erscheinungen sind verwandt, aber nicht in jeder Hinsicht identisch.

    Das deutsche Wort *sehr* führt die R-Vokalisierung also selbst vor: Ein konsonantisches r ist darin kaum noch zu hören.
- type: text
  body: |-
    Das Spanische verhält sich anders. Am Wortende bleibt das r gewöhnlich konsonantisch, meist als kurzer Zungenschlag [ɾ]: *flor* [ˈfloɾ]. Regional und je nach Kontext kann die Realisierung schwächer, länger oder anders ausfallen, bleibt aber in der Regel ein Konsonant. Wer die deutsche Gewohnheit überträgt, spricht *flor* eher wie [ˈfloɐ̯].

    **Deutsch:** *sehr* [zeːɐ̯] · *Vater* [ˈfaːtɐ] **Spanisch:** *flor* [ˈfloɾ]
- type: section_heading
  title: Nicht nur am Wortende
- type: text
  body: Die deutsche R-Vokalisierung und ihre mögliche Übertragung betreffen nicht nur den absoluten Wortauslaut, sondern jedes r am Ende einer Silbe – auch im Wortinneren. In *enfermo* steht das r vor dem *m*, im Spanischen als kurzer Zungenschlag [en.ˈfeɾ.mo]; vokalisiert klänge das Wort etwa wie [en.ˈfeɐ̯.mo]. Gemeinsam ist *flor* und *enfermo* die Silbenendposition des r.
- type: audio_contrast
  title: 'Hörvergleich: *enfermo*'
  lead: Wie wird das *r* in *enfermo* ausgesprochen, bevor das *m* folgt?
  transcript: '*enfermo*'
  examples:
  - role: reference
    subtitle: Mexiko · W50
    audio: corpus/p3-enfermo-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W50
    audio: corpus/p3-enfermo-learner.mp3
- type: section_heading
  title: Zwei r in einem Wort
- type: text
  body: |-
    *Reír* bringt beides zusammen. Im Spanischen beginnt das Wort mit einem mehrfach geschlagenen r und endet mit einem Zungenschlag: [re.ˈiɾ]. Deutschsprachige Lernende übertragen hier mitunter gleich zwei Gewohnheiten: ein hinteres [ʁ] am Wortanfang und die Vokalisierung am Wortende, etwa [ʁe.ˈɪɐ].

    Aus einem anderen Blickwinkel – dem Knacklaut zwischen den beiden Vokalen – kommt *reír* auch auf der Themenseite [Weiches Spanisch, hartes Deutsch](/de/teaching/spanish/soft-spanish-hard-german) vor. Hier geht es allein um das r.
- type: audio_contrast
  title: 'Hörvergleich: *reír*'
  lead: Wie klingen Anfang und Ende des Wortes?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Chile · W76
    audio: corpus/p3-reir-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W76
    audio: corpus/p3-reir-learner.mp3
- type: section_heading
  title: Impulse für den Unterricht
- type: teaching_impulses
  items:
  - title: Das eigene Deutsch entdecken
    body: Vertraute Wörter wie *sehr*, *Vater* und *Lehrer* sprechen und auf die im Deutschen reguläre R-Vokalisierung aufmerksam machen. Wo ist am Ende noch ein konsonantisches r zu hören – und wo nicht?
  - title: Spanische Wortenden bewusst hören
    body: Mit *flor*, *tirar*, *lavar* oder anderen einfachen Wörtern das konsonantische wortfinale r hören und erproben, mit kurzem Zungenkontakt am Zahndamm und ohne zusätzlichen Vokal am Ende.
  - title: Vom Wortende zur Silbe
    body: Mit *enfermo* auf die Silbenendposition übertragen. *Reír* zeigt zusätzlich, dass verschiedene deutsche R-Gewohnheiten – am Wortanfang und am Wortende – in einem Wort zusammenwirken können.
