- type: section_heading
  title: Impulse für den Unterricht
- type: teaching_impulses
  items:
  - title: Das eigene Deutsch entdecken
    body: Vertraute Wörter wie *sehr*, *Vater* und *Lehrer* sprechen und auf die im Deutschen reguläre R-Vokalisierung aufmerksam machen. Wo ist am Ende noch ein konsonantisches r zu hören – und wo nicht?
  - title: Spanische Wortenden bewusst hören
    body: Mit den Hörbeispielen *flor* und *lavar* sowie weiteren einfachen Wörtern wie *tirar* das konsonantische wortfinale r hören und erproben, mit kurzem Zungenkontakt am Zahndamm und ohne zusätzlichen Vokal am Ende.
  - title: Vom Wortende zur Silbe
    body: Mit *enfermo* auf die Silbenendposition übertragen. *Reír* zeigt zusätzlich, dass verschiedene deutsche R-Gewohnheiten – am Wortanfang und am Wortende – in einem Wort zusammenwirken können.
