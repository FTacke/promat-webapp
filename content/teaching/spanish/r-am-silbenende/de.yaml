resource_id: promat-teaching-es-r-am-silbenende
title: 'Das *r* am Wortende'
summary: 'Warum das deutsche *r* häufig zum Vokal wird, das spanische aber konsonantisch bleibt.'
description: 'Warum das deutsche *r* häufig zum Vokal wird, das spanische aber konsonantisch bleibt.'
