resource_id: promat-teaching-es-r-am-silbenende
title: R am Silbenende
summary: Warum das spanische r am Silben- und Wortende häufig konsonantisch ausgesprochen wird – und wie sich dies von der deutschen R-Vokalisierung unterscheidet.
description: 'Das r am Silben- und Wortende im Spanischen: konsonantische Realisierung, Stellungen vor Pause, Konsonant und Vokal sowie Hörvergleiche aus dem Korpus.'
equivalents:
  en: r-am-silbenende
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: 'Am Wortende verschwindet das r? Im Deutschen ist das tatsächlich oft so: Nach Vokal wird /r/ in vielen Standardaussprachen vokalisiert, *wir* klingt dann [viːɐ̯], *Lehrer* [ˈleːʁɐ]. Im Spanischen bleibt das r am Silben- und Wortende dagegen in vielen Varietäten ein konsonantischer Laut.'
- type: overview
  title: Auf einen Blick
  items:
  - 'Deutsch: /r/ wird in der Silbencoda häufig zu einem vokalischen Laut [ɐ̯] (*wir*, *Lehrer*).'
  - 'Spanisch: In vielen Varietäten bleibt das r auch am Silben- und Wortende konsonantisch; das einfache alveolare [ɾ] ist ein wichtiger Referenzlaut.'
  - Die tatsächliche Realisierung hängt von Position, Kontext und Region ab.
- type: section_heading
  title: Hören und entdecken
- type: text
  body: Zweimal dasselbe Wort, das auf *r* endet. Achten Sie auf das Wortende.
- type: audio_contrast
  title: '*reír*: Wie endet das Wort?'
  lead: 'Wie endet das Wort: mit einem Konsonanten oder mit einem Vokal?'
  transcript: reír
  examples:
  - label: Muttersprachliche Referenz
    subtitle: Spanien · W76
    audio: corpus/p3-reir-ref.mp3
    token_id: ES-N-0001 · W76
  - label: Lernende:r (A2)
    subtitle: L1 Deutsch · W76
    audio: corpus/p3-reir-learner.mp3
    token_id: ES-L-0019 · W76
- type: solution
  body: |-
    Eine konsonantische Realisierung endet mit einem kurzen Zungenkontakt am Zahndamm: [re.ˈiɾ]. Eine vokalisierte Variante endet dagegen mit einem schwa-ähnlichen Vokal ohne Zungenkontakt, etwa [ʁe.ˈi.ɐ̯]. Im digitalen Lehrbuch von Hispanistica steht für *reír* genau diese Gegenüberstellung: Zielaussprache [re.ˈiɾ] gegenüber einer Lernendenaussprache [ʁe.ˈɪɐ].

    Ob die Lernendenaufnahme hier konsonantisch oder vokalisch endet, ist nicht vorgegeben: Die Aufnahmen wurden nicht danach ausgewählt. Entscheiden Sie nach Gehör.
- type: section_heading
  title: Was am Silben- und Wortende geschieht
- type: text
  body: |-
    Im Spanischen wird /r/ am Silben- und Wortende üblicherweise als einfacher Vibrant [ɾ] realisiert. Drei Umgebungen sind zu unterscheiden:

    - **Vor einer Pause:** *flor* [ˈfloɾ]. Das Wort endet mit dem r; in emphatischer Rede oder in manchen Varietäten kann es länger, mehrfach oder mit Reibung gesprochen werden.
    - **Silbenfinal vor einem Konsonanten:** *enfermo* [en.ˈfeɾ.mo], *lavar la ropa* [la.ˈβaɾ.la.ˈro.pa]. Das r bildet die Silbencoda und bleibt ein eigener konsonantischer Laut.
    - **Wortfinal vor einem Wort, das mit Vokal beginnt:** *cuidar un perro*. Das r rückt in der verbundenen Rede an den Anfang der nächsten Silbe: [kwi.ˈða.ɾun.ˈpe.ro] (Resilbifizierung). Hier steht es zwischen Vokalen – isoliert klingt *cuidar* also anders als in *cuidar un*.
- type: text
  body: '**Deutsche Vokalisierung und spanisches r.** Wer die deutsche Vokalisierung auf *flor*, *reír* oder *cuidar* überträgt, erzeugt ein Wortende ohne Zungenkontakt, etwa [ˈflo.ɐ̯]. Das fällt hörbar aus dem spanischen Muster. Dass ein Laut ausbleibt, ist jedoch nicht automatisch ein Übertragungsfehler.'
- type: info_box
  title: Lernendenmuster oder regionale Variation?
  body: Spanisches /r/ am Silben- und Wortende ist nicht überall und immer [ɾ]. In Teilen der Karibik wird es etwa abgeschwächt, getilgt oder lateralisiert (in Puerto Rico kann *puerta* wie [ˈpwel.ta] klingen), und in einigen Regionen Lateinamerikas tritt eine assibilierte Variante auf. Eine ausbleibende oder abweichende Realisierung kann also regionale Variation sein. Ob eine Lernendenaufnahme auf Übertragung aus dem Deutschen zurückgeht, lässt sich allein aus der Aufnahme nicht sagen.
- type: section_heading
  title: Weitere Vergleiche aus dem Korpus
- type: text
  body: Dieselben Wörter und Sätze, gesprochen von einer muttersprachlichen Referenzaufnahme und von einer Lernendenaufnahme (Erstsprache Deutsch). Die Aufnahmen stammen aus den kontrollierten Wort- und Satzlisten von *Pronunciation Matters*; die Auswahl ist exemplarisch und beansprucht keine Repräsentativität.
