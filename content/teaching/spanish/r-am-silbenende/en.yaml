resource_id: promat-teaching-es-r-am-silbenende
title: Syllable-final r
summary: Why the Spanish r is often pronounced as a consonant at the end of a syllable or word – and how this differs from German r-vocalisation.
description: 'The r at the end of syllables and words in Spanish: consonantal realisation, positions before a pause, a consonant and a vowel, and listening comparisons from the corpus.'
equivalents:
  de: r-am-silbenende
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: 'Does the r disappear at the end of a word? In German it often does: after a vowel, /r/ is vocalised in many standard varieties, so *wir* sounds like [viːɐ̯] and *Lehrer* like [ˈleːʁɐ]. In Spanish, by contrast, the r at the end of a syllable or word remains a consonant in many varieties.'
- type: overview
  title: At a glance
  items:
  - 'German: /r/ is often realised as a vowel-like sound [ɐ̯] in the syllable coda (*wir*, *Lehrer*).'
  - 'Spanish: in many varieties the r stays consonantal at the end of a syllable or word; the single alveolar tap [ɾ] is an important reference sound.'
  - The actual realisation depends on position, context and region.
- type: section_heading
  title: Listen and discover
- type: text
  body: The same word twice, ending in *r*. Listen to the end of the word.
- type: audio_contrast
  title: '*reír*: how does the word end?'
  lead: 'How does the word end: with a consonant or with a vowel?'
  transcript: reír
  examples:
  - label: Native-speaker reference
    subtitle: Spain · W76
    audio: corpus/p3-reir-ref.mp3
    token_id: ES-N-0001 · W76
  - label: Learner (A2)
    subtitle: L1 German · W76
    audio: corpus/p3-reir-learner.mp3
    token_id: ES-L-0019 · W76
- type: solution
  body: |-
    A consonantal realisation ends with a brief tongue contact at the alveolar ridge: [re.ˈiɾ]. A vocalised variant ends instead with a schwa-like vowel without tongue contact, for example [ʁe.ˈi.ɐ̯]. The digital textbook by Hispanistica gives exactly this contrast for *reír*: target pronunciation [re.ˈiɾ] versus a learner pronunciation [ʁe.ˈɪɐ].

    Whether the learner recording here ends consonantally or vocalically is not given in advance: the recordings were not selected on that basis. Decide by ear.
- type: section_heading
  title: What happens at the end of syllables and words
- type: text
  body: |-
    In Spanish, /r/ at the end of a syllable or word is usually realised as a single tap [ɾ]. Three environments need to be distinguished:

    - **Before a pause:** *flor* [ˈfloɾ]. The word ends with the r; in emphatic speech or in some varieties it can be longer, multiple or fricative.
    - **Syllable-final before a consonant:** *enfermo* [en.ˈfeɾ.mo], *lavar la ropa* [la.ˈβaɾ.la.ˈro.pa]. The r forms the syllable coda and remains a consonant of its own.
    - **Word-final before a word that begins with a vowel:** *cuidar un perro*. In connected speech the r moves to the beginning of the next syllable: [kwi.ˈða.ɾun.ˈpe.ro] (resyllabification). Here it stands between vowels – so *cuidar* sounds different in isolation than in *cuidar un*.
- type: text
  body: '**German vocalisation and the Spanish r.** Anyone who transfers German vocalisation to *flor*, *reír* or *cuidar* produces a word ending without tongue contact, for instance [ˈflo.ɐ̯]. This audibly departs from the Spanish pattern. However, the absence of a sound is not automatically a transfer error.'
- type: info_box
  title: Learner pattern or regional variation?
  body: Spanish /r/ at the end of a syllable or word is not always and everywhere [ɾ]. In parts of the Caribbean it is weakened, deleted or lateralised (in Puerto Rico, *puerta* can sound like [ˈpwel.ta]), and in some regions of Latin America an assibilated variant occurs. A missing or deviating realisation can therefore be regional variation. Whether a learner recording reflects transfer from German cannot be told from the recording alone.
- type: section_heading
  title: More comparisons from the corpus
- type: text
  body: The same words and sentences, spoken by a native-speaker reference recording and by a learner recording (first language German). The recordings come from the controlled word and sentence lists of *Pronunciation Matters*; the selection is illustrative and makes no claim to be representative.
