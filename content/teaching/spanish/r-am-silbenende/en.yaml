resource_id: promat-teaching-es-r-am-silbenende
title: 'The *r* at the End of a Word'
summary: 'Why the German *r* often turns into a vowel while the Spanish *r* stays consonantal.'
description: 'Why the German *r* often turns into a vowel while the Spanish *r* stays consonantal.'
equivalents:
  de: r-am-silbenende
metadata:
  creators:
  - felix-tacke
  - ana-goas-perez
  created: 2026-10-10
  updated: 2026-10-28
blocks:
- type: topic_meta
- type: text
  body: In German, the r at the end of a word often hardly sounds like a consonant any more – in Spanish it remains a distinct, audible sound.
- type: audio_contrast
  title: 'Listening comparison: *flor*'
  lead: How does the *r* at the end of the word sound in the two recordings?
  transcript: '*flor*'
  examples:
  - role: reference
    subtitle: Spain · W16
    audio: corpus/p3-flor-ref.mp3
  - role: learner
    subtitle: L1 German · W16
    audio: corpus/p3-flor-learner.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    In the reference recording, *flor* ends with a brief contact of the tongue tip against the alveolar ridge: [ˈfloɾ]. The learner, by contrast, ends the word with a vowel-like sound, without the tongue tip making contact, so that the pronunciation comes close to [ˈfloɐ̯], as often happens with a final r in German.
- type: section_heading
  title: When the German r becomes a vowel
- type: text
  body: |-
    In Standard German, the *r* at the end of a syllable is often vocalised. In words such as *sehr* (“very”) and in the ending *-er* of *Vater* (“father”) or *Lehrer* (“teacher”), a vowel-like sound is heard instead of a consonant. German-speaking learners may carry this pronunciation pattern over to Spanish.
- type: text
  body: |-
    Spanish behaves differently. At the end of a word, the r usually remains a consonant, mostly a brief tap [ɾ]: *flor* [ˈfloɾ]. Regionally and depending on context, the realisation can be weaker, longer or different, but as a rule it remains a consonant. Anyone who transfers the German habit will pronounce *flor* more like [ˈfloɐ̯].
- type: audio_contrast
  title: 'Listening comparison: *lavar*'
  lead: How is the word-final *r* realised in the two recordings?
  transcript: '*lavar*'
  examples:
  - role: reference
    subtitle: Spain · W9
    audio: corpus/p3-lavar-ref.mp3
  - role: learner
    subtitle: L1 German · W9
    audio: corpus/p3-lavar-learner.mp3
- type: section_heading
  title: When a consonant follows the r
- type: text
  body: German r-vocalisation and its possible transfer concern not only the absolute end of a word but often also an r at the end of a syllable – even inside a word. In *enfermo*, the r stands before the *m*, in Spanish usually as a brief tap [en.ˈfeɾ.mo]; vocalised, the word would sound roughly like [en.ˈfeɐ̯.mo]. What *flor* and *enfermo* have in common is the syllable-final position of the r.
- type: audio_contrast
  title: 'Listening comparison: *enfermo*'
  lead: How does the *r* before *m* sound in the two recordings?
  transcript: '*enfermo*'
  examples:
  - role: reference
    subtitle: Mexico · W50
    audio: corpus/p3-enfermo-ref.mp3
  - role: learner
    subtitle: L1 German · W50
    audio: corpus/p3-enfermo-learner.mp3
- type: section_heading
  title: 'Especially tricky: r at the beginning and at the end'
- type: text
  body: |-
    *Reír* (“to laugh”) brings both together. In Spanish, the word begins with a trilled r and ends with a tap: [re.ˈiɾ]. German-speaking learners may transfer two habits at once here: a back [ʁ] at the beginning of the word and vocalisation at the end, roughly [ʁe.ˈɪɐ].

    *Reír* also appears on the topic page [Soft Spanish, hard German](/en/teaching/spanish/soft-spanish-hard-german), seen from another angle – the glottal stop between the two vowels. Here, only the r matters.
- type: audio_contrast
  title: 'Listening comparison: *reír*'
  lead: How do the *r* at the beginning and the *r* at the end of the word sound in the two recordings?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Chile · W76
    audio: corpus/p3-reir-ref.mp3
  - role: learner
    subtitle: L1 German · W76
    audio: corpus/p3-reir-learner.mp3
- type: section_heading
  title: Classroom prompts
- type: teaching_impulses
  items:
  - title: Discover your own German
    body: Say familiar words such as *sehr*, *Vater* and *Lehrer* and draw attention to the r-vocalisation that is regular in German. Where can a consonantal r still be heard at the end – and where not?
  - title: Listen to Spanish word endings consciously
    body: Use the listening examples *flor* and *lavar* as well as further simple words such as *tirar* to hear and try out the consonantal word-final r, with a brief tongue contact at the alveolar ridge and no additional vowel at the end.
  - title: From word ending to syllable
    body: Use *enfermo* to carry the observation over to the syllable-final position. *Reír* additionally shows that different German r habits – at the beginning and at the end of a word – can work together in a single word.
