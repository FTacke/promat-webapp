- type: section_heading
  title: Für den Unterricht
- type: tip_box
  title: 'Kurzaufgabe: Hördiskrimination'
  body: |-
    1. Die Lehrkraft spricht oder spielt Paare wie *caro* / *carro* und *pero* / *perro* in zufälliger Reihenfolge.
    2. Die Lernenden zeigen mit einem Finger (einfacher Schlag) oder mit mehreren (mehrfacher Schlag), was sie hören.
    3. Danach sprechen alle die Paare nach und vergleichen Zungenposition und Dauer der Vibration: Wo berührt die Zungenspitze den Zahndamm, und wie lange?
