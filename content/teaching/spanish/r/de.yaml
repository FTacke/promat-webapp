- type: section_heading
  title: Wenn das deutsche r ins Spanische übertragen wird
- type: text
  body: |-
    Im Standarddeutschen wird das r meist hinten gebildet: als uvularer Reibelaut [ʁ] am Zäpfchen, nicht mit der Zungenspitze. Regional gibt es im Deutschen allerdings auch vorn gebildete r-Laute. Wer die hintere Gewohnheit überträgt, spricht ein anlautendes r wie in *reloj* mitunter weiter hinten statt als mehrfachen Vibranten [r].
- type: audio_contrast
  title: 'Hörvergleich: *reloj*'
  lead: Wie unterscheidet sich das *r* am Wortanfang in den beiden Aufnahmen?
  transcript: '*reloj*'
  examples:
  - role: reference
    subtitle: Chile · W2
    audio: corpus/p2-reloj-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W2
    audio: corpus/p2-reloj-learner.mp3
- type: text
  body: |-
    *Reír* beginnt und endet mit einem r. Deutschsprachige Lernende können hier mitunter zwei Gewohnheiten übertragen: ein hinteres r am Wortanfang und ein vokalisiertes am Wortende. Hier geht es um den Wortanfang; das Wortende behandelt die Themenseite [Das *r* am Wortende](/de/teaching/spanish/r-am-silbenende) ausführlicher.
- type: audio_contrast
  title: 'Hörvergleich: *reír*'
  lead: Wie klingt das *r* am Wortanfang in den beiden Aufnahmen?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Chile · W76
    audio: corpus/p2-reir-ref.mp3
  - role: learner
    subtitle: L1 Deutsch · W76
    audio: corpus/p2-reir-learner.mp3
- type: section_heading
  title: Nicht jedes r klingt gleich
- type: text
  body: |-
    Schon die Aufnahmen von *caro* und *carro* zeigen: Zwei Sprecher:innen realisieren dasselbe r nicht völlig gleich. Im spanischsprachigen Raum kommen außerdem weitere regionale Realisierungen vor, die das [digitale Lehrbuch](https://linguistik.hispanistica.com/aussprache/#anders-artikulierte-laute-die-r-laute) mit Hörbeispielen vorstellt. Nicht jede Abweichung von einem einzelnen Referenzmodell ist deshalb ein Aussprachefehler.
- type: info_box
  title: Herkunftssprachen als Ressource
  body: Nicht alle Lernenden müssen das spanische r von Grund auf neu erlernen. Wer zum Beispiel Türkisch, Kurdisch oder Italienisch spricht, kennt die Artikulation mit der Zungenspitze am Zahndamm oft schon aus der eigenen Sprache. Das mehrfache Vibrieren und vor allem die Unterscheidung zwischen einfachem und mehrfachem r kann dennoch neu sein. Herkunftssprachen sind damit eine wichtige Ressource für den Ausspracheunterricht.
- type: section_heading
  title: Impulse für den Unterricht
- type: teaching_impulses
  items:
  - title: Erst den Unterschied hören
    body: Mit den Wortpaaren *pero* / *perro* und *caro* / *carro* auf die bedeutungsunterscheidende Funktion des einfachen und mehrfachen Vibranten aufmerksam machen – zuerst hören und beschreiben lassen, was sich unterscheidet, danach die Bedeutungen klären.
  - title: Erkennen, wo das r gebildet wird
    body: 'Das vordere spanische r kurz dem im Standarddeutschen verbreiteten hinteren r gegenüberstellen, etwa mit *Rose* (deutsch) und *rosa* (spanisch). Für *claro* schlägt das digitale Lehrbuch vor, sich zunächst ein *d* statt des *r* vorzustellen und das Wort immer schneller zu sprechen, bis die Zungenspitze den typischen kurzen Kontakt am Zahndamm erzeugt.'
  - title: Die Schreibung als Hilfe nutzen
    body: Anhand der Wortpaare zeigen, dass ⟨r⟩ und ⟨rr⟩ zwischen Vokalen einen echten Lautunterschied kennzeichnen. Dabei lassen sich vorhandene Herkunftssprachen der Lernenden einbeziehen.
