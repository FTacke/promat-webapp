    title: Das spanische r
    lead: Tap und Trill brauchen im Unterricht unterschiedliche Aufgabenformate und unterschiedliche Geduld.
  - type: rich_text
    title: Was Lernende unterscheiden sollten
    body: |
      Lernende profitieren von einer klaren Unterscheidung zwischen dem **einfachen Schlaglaut** und dem **gerollten r**.

      Für den Unterricht ist wichtiger, *wann* eine Unterscheidung hörbar relevant wird, als eine vollständige phonetische Terminologie von Anfang an.
