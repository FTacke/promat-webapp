title: 'Das spanische *r*'
summary: 'Zwei spanische *r*-Laute – und warum das deutsche *r* anders klingt.'
description: 'Zwei spanische *r*-Laute – und warum das deutsche *r* anders klingt.'
equivalents:
  en: r
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-28
blocks:
- type: topic_meta
- type: text
  body: Im Spanischen können zwei verschiedene r-Laute sogar zwei verschiedene Wörter kennzeichnen. Hinzu kommt ein deutlicher Unterschied zur verbreiteten deutschen Aussprache des r. Beides lässt sich an authentischen Korpusaufnahmen nachvollziehen.
- type: audio_contrast
  title: 'Hörvergleich: *pero – perro*'
  lead: Worin unterscheiden sich die beiden r-Laute?
  transcript: '*pero – perro*'
  examples:
  - role: reference
    subtitle: Spanien · W90
    audio: corpus/p2-pero-ref-a.mp3
  - role: reference
    subtitle: Chile · W90
    audio: corpus/p2-pero-ref-b.mp3
- type: solution
  title: 'Auflösung: Was ist zu hören?'
  body: |-
    In beiden Aufnahmen schlägt die Zungenspitze in *pero* [ˈpeɾo] einmal kurz an, in *perro* [ˈpero] mehrfach rasch hintereinander. Dieser Unterschied genügt, um aus „aber“ einen „Hund“ zu machen.
- type: section_heading
  title: Zwei r-Laute – und die Schrift hilft mit
- type: text
  body: |-
    Beide spanischen r-Laute entstehen vorn im Mundraum, mit der Zungenspitze am Zahndamm. Beim einfachen Vibranten [ɾ] schlägt die Zungenspitze nur einmal kurz an. Beim mehrfachen Vibranten [r] liegt sie locker am Zahndamm und wird vom Luftstrom in Schwingung versetzt, sodass mehrere rasche Kontakte entstehen. Im Standarddeutschen wird das r dagegen häufig weiter hinten gebildet, am Zäpfchen.
- type: image
  src: spanish-german-r-articulation.png
  size: wide
  alt: 'Schematische Seitenschnitte des Mundraums: links die spanischen alveolaren R-Laute [ɾ] und [r] mit vorderer Zungenartikulation, rechts das deutsche uvulare [ʁ] mit weiter hinten liegender Artikulationsstelle.'
  caption: 'Die spanischen R-Laute [ɾ] und [r] werden mit der Zungenspitze am Zahndamm gebildet. Beim im Standarddeutschen verbreiteten [ʁ] liegt die Artikulationsstelle dagegen weiter hinten, am Zäpfchen. Die schematische Darstellung zeigt den Unterschied der Artikulationsorte.'
  credit: 'Illustration: Felix Tacke (Konzept und Prompting), KI-generiert · Pronunciation Matters (2026)'
- type: text
  body: |-
    Zwischen Vokalen unterscheiden die beiden Laute Wörter, und die Schreibung macht das sichtbar: Einfaches ⟨r⟩ steht für [ɾ], ⟨rr⟩ für [r] – *pero* und *perro*, *caro* und *carro*.

    Am Wortanfang gibt es diesen Gegensatz nicht. Dort steht ein einfach geschriebenes ⟨r⟩ gewöhnlich für den mehrfachen Vibranten, etwa in *reloj* [reˈlox].
- type: section_heading
  title: Einfach und mehrfach – auch bei anderen Wörtern
- type: audio_contrast
  title: 'Hörvergleich: *caro*'
  lead: Wie klingt das einfache *r* bei den beiden Referenzsprecher:innen?
  transcript: '*caro*'
  examples:
