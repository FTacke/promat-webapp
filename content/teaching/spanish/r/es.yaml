resource_id: promat-teaching-es-r
title: Las dos erres del español
summary: Dos sonidos de *r* en español y por qué la *r* del alemán suele sonar diferente.
description: Dos sonidos de *r* en español y por qué la *r* del alemán suele sonar diferente.
