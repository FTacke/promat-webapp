blocks:
- type: topic_meta
- type: text
  body: En español, dos sonidos distintos de *r* pueden bastar para diferenciar dos palabras. Además, ambos contrastan claramente con una pronunciación de la *r* muy extendida en alemán. Las grabaciones auténticas del corpus permiten escuchar las dos diferencias.
- type: audio_contrast
  title: 'Comparación auditiva: *pero – perro*'
  lead: ¿En qué se diferencian los dos sonidos de *r*?
  transcript: '*pero – perro*'
  examples:
  - role: reference
    subtitle: España · W90
    audio: corpus/p2-pero-ref-a.mp3
  - role: reference
    subtitle: Chile · W90
    audio: corpus/p2-pero-ref-b.mp3
- type: solution
  title: 'Solución: ¿qué se oye?'
  body: En ambas grabaciones, la punta de la lengua realiza un solo contacto breve en *pero* [ˈpeɾo], mientras que en *perro* [ˈpero] vibra y golpea varias veces con rapidez. Esa diferencia basta para distinguir la conjunción *pero* del sustantivo *perro*.
- type: section_heading
  title: 'Dos sonidos de r: la escritura también da pistas'
- type: text
  body: Los dos sonidos de *r* del español se articulan en la parte anterior de la boca, con la punta de la lengua contra los alvéolos, justo detrás de los dientes superiores. En la **vibrante simple [ɾ]**, la punta de la lengua realiza un solo contacto breve. En la **vibrante múltiple [r]**, la punta se mantiene relajada junto a los alvéolos y la corriente de aire la hace vibrar, produciendo varios contactos rápidos. En alemán estándar, en cambio, la *r* suele articularse más atrás, a la altura de la úvula.
- type: image
  src: spanish-german-r-articulation.png
  size: wide
  alt: 'Cortes esquemáticos de la cavidad bucal de perfil: a la izquierda, articulación anterior con la punta de la lengua de las erres alveolares españolas [ɾ] y [r]; a la derecha, articulación uvular posterior de la [ʁ] alemana.'
  caption: Las erres españolas [ɾ] y [r] se articulan con la punta de la lengua contra los alvéolos. En cambio, el sonido [ʁ], frecuente en alemán estándar, se articula más atrás, a la altura de la úvula. El esquema muestra la diferencia entre ambos puntos de articulación.
  credit: 'Ilustración: Felix Tacke (concepto y elaboración de las instrucciones), generada con IA · Pronunciation Matters (2026)'
- type: text
  body: |-
    Entre vocales, estos dos sonidos pueden distinguir palabras, y la escritura refleja la diferencia: la letra simple ⟨r⟩ representa [ɾ], mientras que ⟨rr⟩ representa [r], como en *pero* y *perro* o en *caro* y *carro*.

    Al principio de palabra no existe este contraste. En esa posición se escribe una sola ⟨r⟩, que normalmente representa la vibrante múltiple, como en *reloj* [reˈlox].
- type: section_heading
  title: Vibrante simple y múltiple en otras palabras
- type: audio_contrast
  title: 'Comparación auditiva: *caro*'
