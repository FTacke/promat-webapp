- type: section_heading
  title: Cuando la r alemana se traslada al español
- type: text
  body: En alemán estándar, la *r* suele articularse en la parte posterior de la boca, como fricativa uvular [ʁ], y no con la punta de la lengua. Sin embargo, algunas variedades regionales del alemán también presentan sonidos de *r* articulados más adelante. Cuando se transfiere el hábito de articularla atrás, una *r* inicial como la de *reloj* puede pronunciarse en esa zona posterior en lugar de realizarse como vibrante múltiple [r].
- type: audio_contrast
  title: 'Comparación auditiva: *reloj*'
  lead: ¿En qué se diferencia la *r* inicial de las dos grabaciones?
  transcript: '*reloj*'
  examples:
  - role: reference
    subtitle: Chile · W2
    audio: corpus/p2-reloj-ref.mp3
  - role: learner
    subtitle: L1 alemán · W2
    audio: corpus/p2-reloj-learner.mp3
- type: text
  body: '*Reír* empieza y termina con una *r*. En esta palabra, los aprendientes germanohablantes pueden transferir dos hábitos diferentes: una *r* posterior al principio y una *r* vocalizada al final. Aquí el foco está en el inicio de palabra; la página [La *r* al final de palabra](/de/teaching/spanish/es/r-am-silbenende) trata con más detalle el sonido final.'
- type: audio_contrast
  title: 'Comparación auditiva: *reír*'
  lead: ¿Cómo suena la *r* inicial en las dos grabaciones?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Chile · W76
    audio: corpus/p2-reir-ref.mp3
  - role: learner
    subtitle: L1 alemán · W76
    audio: corpus/p2-reir-learner.mp3
- type: section_heading
  title: No todas las erres suenan igual
- type: text
  body: Las propias grabaciones de *caro* y *carro* muestran que dos hablantes no realizan un mismo sonido de *r* exactamente de la misma manera. En el mundo hispanohablante existen, además, otras realizaciones regionales que se presentan con ejemplos sonoros en el [manual digital](https://linguistik.hispanistica.com/aussprache/#anders-artikulierte-laute-die-r-laute). Por tanto, no toda diferencia respecto de un único modelo de referencia constituye un error de pronunciación.
- type: info_box
  title: Las lenguas de herencia como recurso
  body: No todos los aprendientes tienen que aprender desde cero la articulación de la *r* española. Quienes hablan, por ejemplo, turco, kurdo o italiano ya suelen conocer de sus propias lenguas la articulación con la punta de la lengua contra los alvéolos. Aun así, la vibración múltiple y, sobre todo, la distinción entre la vibrante simple y la múltiple pueden ser nuevas. Las lenguas de herencia constituyen así un recurso importante para enseñar pronunciación.
- type: section_heading
  title: Sugerencias para el aula
- type: teaching_impulses
  items:
  - title: Escuchar primero la diferencia
    body: Utilizar los pares *pero* / *perro* y *caro* / *carro* para mostrar que la vibrante simple y la múltiple permiten distinguir significados. Escuchar y describir primero la diferencia; aclarar después el significado de las palabras.
  - title: Reconocer dónde se articula la r
    body: Contrastar brevemente la *r* anterior del español con la *r* posterior frecuente en alemán estándar, por ejemplo mediante las palabras *Rose* (alemán) y *rosa* (español). Para practicar *claro*, el manual digital propone imaginar primero una *d* en lugar de la *r* y acelerar progresivamente la articulación hasta que la punta de la lengua produzca el contacto característico.
  - title: Aprovechar la escritura
    body: Mostrar con los pares de palabras que ⟨r⟩ y ⟨rr⟩ entre vocales representan una verdadera diferencia de sonidos. También se pueden aprovechar las lenguas de herencia presentes en el grupo.
