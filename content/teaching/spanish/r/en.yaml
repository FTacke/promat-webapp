resource_id: promat-teaching-es-r
title: 'The Spanish *r*'
summary: 'Two Spanish *r* sounds – and why the German *r* sounds different.'
description: 'Two Spanish *r* sounds – and why the German *r* sounds different.'
equivalents:
  de: r
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-24
blocks:
- type: topic_meta
- type: text
  body: In Spanish, two different r sounds can even distinguish two different words. On top of that, there is a clear difference from the common German pronunciation of r. Both can be followed in authentic corpus recordings.
- type: audio_contrast
  title: 'Listening comparison: *pero – perro*'
  lead: How do the two r sounds differ?
  transcript: '*pero – perro*'
  examples:
  - role: reference
    subtitle: Spain · W90
    audio: corpus/p2-pero-ref-a.mp3
  - role: reference
    subtitle: Chile · W90
    audio: corpus/p2-pero-ref-b.mp3
- type: solution
  title: 'Solution: What can be heard?'
  body: |-
    In both recordings, the tip of the tongue taps once, briefly, in *pero* [ˈpeɾo] and several times in quick succession in *perro* [ˈpero]. That difference is enough to turn “but” into “dog”.
- type: section_heading
  title: Two r sounds – and the spelling helps
- type: text
  body: |-
    Both Spanish r sounds are made at the front of the mouth, with the tip of the tongue at the alveolar ridge. For the tap [ɾ], the tongue tip strikes the ridge only once, briefly. For the trill [r], it rests loosely at the ridge and is set vibrating by the airstream, so that several rapid contacts occur. In Standard German, by contrast, the r is often produced further back, at the uvula.
- type: image
  src: spanish-german-r-articulation.png
  size: wide
  alt: 'Schematic side views of the mouth: on the left, the Spanish alveolar r sounds [ɾ] and [r] with the tongue articulating at the front; on the right, the German uvular [ʁ] with a place of articulation further back.'
  caption: 'The Spanish r sounds [ɾ] and [r] are produced with the tip of the tongue at the alveolar ridge. For [ʁ], which is common in Standard German, the place of articulation is further back, at the uvula. The schematic illustration shows the difference between the places of articulation.'
  credit: 'Illustration: Felix Tacke (concept and prompting), AI-generated · Pronunciation Matters (2026)'
- type: text
  body: |-
    Between vowels, the two sounds distinguish words, and the spelling makes this visible: a single ⟨r⟩ stands for [ɾ], ⟨rr⟩ for [r] – *pero* and *perro*, *caro* and *carro*.

    At the beginning of a word there is no such contrast. There, a single written ⟨r⟩ usually stands for the trill, for example in *reloj* [reˈlox].
- type: section_heading
  title: Tap and trill – in other words, too
- type: audio_contrast
  title: 'Listening comparison: *caro*'
  lead: How does the tapped *r* sound for the two reference speakers?
  transcript: '*caro*'
  examples:
  - role: reference
    subtitle: Spain · W85
    audio: corpus/p2-caro-ref-a.mp3
  - role: reference
    subtitle: Chile · W85
    audio: corpus/p2-caro-ref-b.mp3
- type: audio_contrast
  title: 'Listening comparison: *carro*'
  lead: How does the trilled *rr* sound for the two reference speakers?
  transcript: '*carro*'
  examples:
  - role: reference
    subtitle: Spain · W57
    audio: corpus/p2-carro-ref-a.mp3
  - role: reference
    subtitle: Chile · W57
    audio: corpus/p2-carro-ref-b.mp3
- type: section_heading
  title: When the German r is carried over into Spanish
- type: text
  body: |-
    In Standard German, the r is usually produced at the back: as a uvular fricative [ʁ] at the uvula, not with the tip of the tongue. Regionally, however, German also has r sounds produced at the front. Anyone who transfers the back habit may sometimes pronounce an initial r, as in *reloj*, further back instead of as the trill [r].
- type: audio_contrast
  title: 'Listening comparison: *reloj*'
  lead: How does the *r* at the beginning of the word differ in the two recordings?
  transcript: '*reloj*'
  examples:
  - role: reference
    subtitle: Chile · W2
    audio: corpus/p2-reloj-ref.mp3
  - role: learner
    subtitle: L1 German · W2
    audio: corpus/p2-reloj-learner.mp3
- type: text
  body: |-
    *Reír* begins and ends with an r. German-speaking learners may sometimes carry over two habits here: a back r at the beginning of the word and a vocalised one at the end. Here, the focus is on the beginning of the word; the end of the word is treated in more detail on the topic page [The *r* at the End of a Word](/en/teaching/spanish/r-am-silbenende).
- type: audio_contrast
  title: 'Listening comparison: *reír*'
  lead: How does the *r* at the beginning of the word sound in the two recordings?
  transcript: '*reír*'
  examples:
  - role: reference
    subtitle: Chile · W76
    audio: corpus/p2-reir-ref.mp3
  - role: learner
    subtitle: L1 German · W76
    audio: corpus/p2-reir-learner.mp3
- type: section_heading
  title: Not every r sounds the same
- type: text
  body: |-
    Even the recordings of *caro* and *carro* show it: two speakers do not realise the same r in exactly the same way. Moreover, the Spanish-speaking world has further regional realisations of the r, which the [digital textbook](https://linguistik.hispanistica.com/aussprache/#anders-artikulierte-laute-die-r-laute) presents with listening examples (in German). Not every deviation from a single reference model is therefore a pronunciation error.
- type: info_box
  title: Heritage languages as a resource
  body: Not all learners have to learn the Spanish r from scratch. Anyone who speaks Turkish, Kurdish or Italian, for example, often already knows the articulation with the tip of the tongue at the alveolar ridge from their own language. Trilling several times and, above all, the distinction between a tap and a trill may still be new. Heritage languages are thus an important resource for pronunciation teaching.
- type: section_heading
  title: Classroom prompts
- type: teaching_impulses
  items:
  - title: Hear the difference first
    body: Use the word pairs *pero* / *perro* and *caro* / *carro* to draw attention to the meaning-distinguishing function of the tap and the trill – first listen and let learners describe what differs, then clarify the meanings.
  - title: Make the place of articulation conscious
    body: Briefly contrast the front Spanish r with the back r common in Standard German, for example with *Rose* and *rosa*. For *claro*, the digital textbook suggests first imagining a d instead of the r and saying it faster and faster until the tip of the tongue taps by itself.
  - title: Use the spelling as a help
    body: Use the word pairs to show that ⟨r⟩ and ⟨rr⟩ between vowels mark a real difference in sound. Learners’ existing heritage languages can be brought in here.
