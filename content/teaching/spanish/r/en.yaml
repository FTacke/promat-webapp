- type: section_heading
  title: Two phonemes, two articulations
- type: text
  body: |-
    Spanish has two rhotic phonemes. Both are produced with the tip of the tongue:

    - **/ɾ/** (single vibrant, “tap”): the tongue tip touches the alveolar ridge for a very short moment and releases immediately.
    - **/r/** (multiple vibrant, “trill”): the tongue tip rests loosely close to the alveolar ridge and is set vibrating by the airstream; usually two to three brief contacts occur.
- type: text
  body: '**Positional conditions.** Only between vowels do /ɾ/ and /r/ contrast: *pero* [ˈpe.ɾo] – *perro* [ˈpe.ro]. At the beginning of a word (*reloj*, *rojo*) and after *n*, *l*, *s* (*honra*, *alrededor*, *israelí*) only the trill occurs; a single `r` is written there. After a consonant within a cluster (*tres*, *brazo*) and at the end of a syllable or word (*mar*, *carta*) the single tap is usual. Spelling therefore only reflects the meaning-distinguishing contrast between vowels: `r` and `rr` are not a one-to-one image of the two sounds.'
- type: info_box
  title: Not every r sounds the same
  body: The realisations described are points of reference, not rules. In parts of Latin America (for example Mexico, Costa Rica, Chile, the Andean region) the trill is often assibilated, that is, produced with a fricative component. In Puerto Rico a back, velar r is widespread. At the end of a word and in fast speech the realisation also varies. Regional variation is not a pronunciation error – in learner recordings, however, it cannot easily be separated from transfer effects.
- type: section_heading
  title: More comparisons from the corpus
- type: text
  body: The same words and sentences, spoken by a native-speaker reference recording and by a learner recording (first language German). The recordings come from the controlled word and sentence lists of *Pronunciation Matters*; the selection is illustrative and makes no claim to be representative.
