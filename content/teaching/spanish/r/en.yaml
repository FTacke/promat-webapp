    token_id: ES-L-0012 · W88
- type: solution
  body: |-
    The recordings contain the minimal pair *caro* – *carro*. In the first word the tongue tip strikes once: [ˈka.ɾo]. In the second word it vibrates several times: [ˈka.ro].

    Listen closely to how the learner recording produces the second word: as a trilled r, as a single tap, or with a different r sound? The recordings were not selected by how well or badly the contrast is produced.
- type: audio_contrast
  title: '*pero* – *perro*'
  lead: Which of the two words has the longer r sound?
  transcript: pero – perro
  examples:
