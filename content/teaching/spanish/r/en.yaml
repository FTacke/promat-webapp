resource_id: promat-teaching-es-r
title: The Spanish r
summary: One tongue tap or several? Why *caro* and *carro* sound different.
description: 'The two Spanish r phonemes /ɾ/ and /r/: articulation, positional conditions and listening comparisons from the corpus with a short classroom task.'
equivalents:
  de: r
metadata:
  creators:
  - felix-tacke
  created: 2026-10-10
  updated: 2026-10-10
blocks:
- type: topic_meta
- type: text
  body: |-
    *caro* or *carro*? One more letter – and a different word. Spanish distinguishes two r sounds whose contrast between vowels carries meaning: *pero* (“but”) and *perro* (“dog”), *caro* (“expensive”) and *carro* (“cart”).

    For German-speaking learners this is doubly difficult: the familiar German r is often produced further back in the mouth (uvular) and is frequently vocalised after vowels. Both Spanish r sounds, by contrast, are made with the tip of the tongue.
- type: overview
  title: At a glance
  items:
  - '/ɾ/, the single tap: a brief contact of the tongue tip against the alveolar ridge.'
  - '/r/, the multiple vibrant (trill): several rapid contacts in a row.'
  - Only between vowels do the two sounds distinguish words; at the beginning of a word [r] appears, at the end of a word usually [ɾ].
- type: section_heading
  title: Listen and discover
- type: text
  body: 'Two recordings of the same pair of words, without the written form. Listen for the tongue taps: one in the first word, several in the second?'
- type: audio_contrast
  title: Two words, two r sounds
  lead: How often does the tongue tip strike in the first word, and how often in the second?
  examples:
