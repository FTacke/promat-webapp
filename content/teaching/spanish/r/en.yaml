- type: section_heading
  title: For the classroom
- type: tip_box
  title: 'Quick task: listening discrimination'
  body: |-
    1. The teacher says or plays pairs such as *caro* / *carro* and *pero* / *perro* in random order.
    2. Learners hold up one finger (single tap) or several (multiple taps) to show what they hear.
    3. Then everyone repeats the pairs and compares tongue position and the duration of the vibration: where does the tongue tip touch the alveolar ridge, and for how long?
