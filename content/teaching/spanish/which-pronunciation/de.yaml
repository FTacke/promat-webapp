blocks:
  - type: topic_meta
    layout:
      span: 2
  - type: text
    layout:
      span: 1
    body: |
      Sorgfältige Aussprache gibt es in allen spanischsprachigen Ländern – sie klingt nur unterschiedlich.
      Viele Lehrkräfte und Lernende gehen stillschweigend davon aus, die Aussprache Zentral- und Nordspaniens sei die eigentliche Zielaussprache. Das ist sie nicht.
      Am deutlichsten hörbar wird diese Frage an einem Merkmal: Wird zwischen `s` und `z/c` unterschieden (*distinción*) – oder nicht (*seseo*)?
  - type: overview
    layout:
      span: 1
    title: Auf einen Blick
    items:
      - Über 90 % der Spanischsprechenden leben außerhalb Spaniens.
      - Die Mehrheit spricht *caza* und *casa* gleich aus (*seseo*).
      - Diese Seite macht die Unterschiede in den Aussprachemodellen hörbar und erklärt, warum *seseo* und *distinción* gleichermaßen korrekt sind.
  - type: section_heading
    layout:
      span: 2
    title: Hörvergleich
  - type: text
    layout:
      span: 2
    body: |
      Wie klingt der Unterschied? Die folgenden Aufnahmen zeigen dasselbe Wortpaar und dieselbe Wortreihe – einmal mit *distinción*, einmal mit *seseo*.
      Für den Unterricht ist entscheidend, beide Realisierungen – *distinción* und *seseo* – als gleichberechtigte Variation hörbar zu machen.
  - type: audio_contrast
    layout:
      span: 2
    title: "Mit und ohne Unterscheidung: *casa* vs. *caza*"
    lead: "Der Vergleich zeigt, dass `z/c` und `s` – je nach Herkunft der Sprecher:innen – unterschiedlich oder gleich ausgesprochen werden."
    transcript: "casa – caza"
    examples:
      - label: "*Distinción*"
        subtitle: Zentral-/Nordspanien
        audio: variation/distincion-casa-caza.mp3
        note: "*casa* und *caza* werden unterschiedlich ausgesprochen."
      - label: "*Seseo*"
        subtitle: Hispanoamerika / Kanaren / Teile Andalusiens
        audio: variation/seseo-casa-caza.mp3
        note: "*casa* und *caza* werden gleich ausgesprochen."
  - type: audio_contrast
    layout:
      span: 2
    title: "Anders, aber genauso korrekt"
    lead: "Anhand dieser Wortreihe wird die Aussprache mit Interdentallaut und als `s` besonders deutlich hörbar."
    transcript: "gracias – ciudad – paz – ración"
    examples:
      - label: "*Distinción*"
        subtitle: Zentral-/Nordspanien
        audio: variation/distincion-word-series.mp3
        note: "Besonders hörbar bei `c` in *gracias* und *ciudad* sowie `z` in *paz*."
      - label: "*Seseo*"
        subtitle: Hispanoamerika / Kanaren / Teile Andalusiens
        audio: variation/seseo-word-series.mp3
        note: "`c`, `z` und `ci` werden hier wie `s` ausgesprochen."
  - type: section_heading
    layout:
      span: 2
    title: "*Seseo* und *distinción*"
  - type: text
    layout:
      span: 1
    body: |
      Der Unterschied, den die Aufnahmen zeigen, betrifft nicht einzelne Wörter, sondern ganze Regionen.
      Die folgenden Karten zeigen, wo der *seseo* und wo die *distinción* die übliche Aussprache ist.
  - type: embed
    layout:
      span: 1
    title: "Spanien: *distinción*, *seseo* und *ceceo*"
    provider: datawrapper
    src: https://datawrapper.dwcdn.net/poSnB/9/
    height: 533
  - type: info_box
    layout:
      span: 1
    title: "Die Mehrheit ist *seseante*"
    body: |
      Bei der *distinción* werden `s` und `z/c` vor `e/i` unterschiedlich ausgesprochen: *casa* und *caza* haben verschiedene Laute.
      Beim *seseo* fallen sie zusammen: *casa* und *caza* werden gleich ausgesprochen.
      Die *distinción*, also die Unterscheidung, wird nur in Zentral- und Nordspanien gemacht.
      Der *seseo* ist in fast ganz Hispanoamerika, auf den Kanaren und in Teilen Andalusiens üblich – dort, wo über 90 % aller Spanischsprechenden leben.

      Merksatz: Wer `caza` wie `casa` ausspricht, spricht ein ebenso gutes Spanisch.
  - type: embed
    layout:
      span: 1
    title: "*Seseo* in Hispanoamerika"
    provider: datawrapper
    src: https://datawrapper.dwcdn.net/Uza2n/5/
    height: 831
  - type: section_heading
    layout:
      span: 2
    title: "Der *seseo* in Hispanoamerika: Hörbeispiele"
  - type: text
    layout:
      span: 2
    body: |
      Kurze Ausschnitte aus Radiosendungen zeigen, dass der *seseo* in vielen Varietäten die normale Aussprache ist.
  - type: audio_examples
    layout:
      span: 2
    title: "Der *seseo* in authentischen Audioausschnitten"
    lead: "In diesen Beispielen hört man Radiosprecher:innen aus Hispanoamerika. Sie veranschaulichen, wie normal es ist, `z` und `c` vor `e/i` als `s` zu realisieren."
    source:
      label: CO.RA.PAN
      url: https://corapan.hispanistica.com
    examples:
      - label: Mexiko
        transcript: "… esta mujer que se *hizo* famosa en 2017 *gracias* a un video que se hizo viral."
        note: "In *gracias* und *hizo* werden `z/c` vor `e/i` wie `s` ausgesprochen."
        token_id: MEXb80def27c
        audio: corapan/MEXb80def27c.mp3
      - label: Chile
        transcript: "Se ve espectacular y está más *cerca*."
        note: "In *cerca* wird `c` wie `s` ausgesprochen."
        token_id: CHL8b78ac16b
        audio: corapan/CHL8b78ac16b.mp3
      - label: Argentinien
        transcript: "… *cerca* de Miami."
        note: "Auch hier wird `c` in *cerca* wie `s` ausgesprochen."
        token_id: ARGCBAeca46a987
        audio: corapan/ARGCBAeca46a987.mp3
      - label: Costa Rica
        transcript: "Gana una *cena* para cuatro personas."
        note: "In *cena* wird `c` wie `s` ausgesprochen."
        token_id: CRI61d9dc2dc
        audio: corapan/CRI61d9dc2dc.mp3
  - type: section_heading
    layout:
      span: 2
    title: Impulse für den Unterricht
  - type: text
    layout:
      span: 2
    body: |
      Aus den Vergleichen ergeben sich konkrete Entscheidungen für den Unterricht:
  - type: rich_text
    layout:
      span: 2
    variant: didactic_close
    body: |
      - **Erst hören lassen**  
        Vor der Erklärung die Hörbeispiele abspielen: Hören die Lernenden einen Unterschied zwischen *casa* und *caza*?
      - **Variation sichtbar machen**  
        Mit den Karten zeigen: *distinción* ist regional begrenzt, *seseo* ist in großen Teilen der spanischsprachigen Welt normal.
      - **Normen klären**  
        Festhalten: *seseo* und *distinción* sind keine Fehlerhierarchie, sondern gleichwertige Aussprachevarianten.
  - type: further_reading
    layout:
      span: 2
    title: Vertiefung
    description: Weitere Aussprachemerkmale werden im begleitenden Material mit Hörbeispielen aufgegriffen.
    items:
      - title: "`ll` und `y`"
        text: 'Der *yeísmo* ist heute die Norm: `ll` und `y` werden meist gleich ausgesprochen. In Argentinien und Uruguay klingt der Laut oft wie `sch`.'
        cta: Hier mehr erfahren
        href: https://linguistik.hispanistica.com/variation/variation_aussprache/#yeismo
      - title: /s/-Abschwächung
        text: In vielen Regionen wird /s/ am Silben- oder Wortende abgeschwächt oder getilgt. Für den Unterricht ist das vor allem beim Hörverstehen relevant.
        cta: Hier mehr erfahren
        href: https://linguistik.hispanistica.com/variation/variation_aussprache/#s-am-silbenende-abschwachung-und-schwund
