title: Welche Aussprache unterrichten?
summary: "Warum *seseo* und *distinción* gleichwertige Aussprachen sind – und was das für den Unterricht bedeutet."
description: Gibt es die eine richtige Aussprache im Spanischen? Und was heißt das für den Unterricht?
equivalents:
  en: which-pronunciation
