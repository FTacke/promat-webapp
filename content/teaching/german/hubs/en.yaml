title: Understanding German Pronunciation
overview_intro: The topic pages offer linguistic guidance, listening examples, and ideas for short pronunciation activities in German lessons. Often, just ten minutes here and there are enough – and many of these features can be introduced as early as A1 with suitable examples.
card_columns: 2
groups:
- title: Getting started
  description: A first look at a central pronunciation feature of German.
  topics:
  - miete-or-mitte
- title: Exploring pronunciation features
  description: Explore pronunciation patterns and discover ways to address them in the classroom.
  topics:
  - ich-or-ach
  - final-devoicing
  - german-stress
