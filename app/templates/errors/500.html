{% extends "base.html" %}

{% block page_title %}{{ format_page_title(t('errors.500.page_title')) }}{% endblock %}

{% block content %}
<section class="pm-feature-band" aria-labelledby="pm-error-title">
  <div class="pm-container">
    <div class="pm-error-surface pm-surface-density--standard">
      <div class="pm-error-surface__body">
        <span class="pm-error-surface__code">500</span>
        <h1 id="pm-error-title" class="pm-error-surface__title">{{ t('errors.500.title') }}</h1>
        <p class="pm-error-surface__text">{{ t('errors.500.message') }}</p>
      </div>
      <div class="pm-error-surface__actions pm-action-row">
        <a href="{{ url_for('public.landing_page') }}" class="pm-action-button pm-action-button--primary pm-action-button--medium">
          <span class="pm-action-button__label">{{ t('common.actions.home') }}</span>
        </a>
        <a href="javascript:location.reload()" class="pm-action-button pm-action-button--secondary pm-action-button--medium">
          <span class="pm-action-button__label">{{ t('common.actions.reload_page') }}</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
