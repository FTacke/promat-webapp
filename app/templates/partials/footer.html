<div class="promat-footer" data-element="site-footer">
  <div class="promat-footer__content">
    <div class="promat-footer__row promat-footer__row--primary">
      <p class="promat-footer__title">{{ footer_logo_alt }}</p>
      <p class="promat-footer__version">
        <a href="{{ app_release_url }}"
           class="promat-footer__link"
           target="_blank"
           rel="noopener noreferrer">{{ app_release_tag }}</a>
      </p>
    </div>

    <div class="promat-footer__row promat-footer__row--secondary">
      <p class="promat-footer__meta"><span class="promat-footer__meta-primary">© {{ footer_meta_year }} {{ institution_name }}</span><span class="promat-footer__meta-secondary"> · <a href="{{ footer_partner_url }}" class="promat-footer__link" target="_blank" rel="noopener noreferrer">{{ footer_partner_label }}</a> · {{ footer_copyright_holder }}</span></p>

      <nav class="promat-footer__nav" aria-label="{{ t('section.legal') }}">
        <a href="{{ url_for('public.impressum_page') }}" class="promat-footer__link">{{ t('footer.imprint') }}</a>
        <a href="{{ url_for('public.privacy_page') }}" class="promat-footer__link">{{ t('footer.privacy') }}</a>
      </nav>
    </div>

    <!-- BUILD {{ config.get('APP_BUILD_ID', 'dev') }} -->
  </div>
</div>
