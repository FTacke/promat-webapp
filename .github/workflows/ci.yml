name: CI

# This workflow is the release gate for `main`.
#
# Production deployment (.github/workflows/deploy.yml) starts only from a *successful completion of this
# workflow* for the exact commit being deployed. Every job below is therefore part of the production gate:
# a failure in any of them stops the deploy. Keep "release-gate" listing every other job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Never cancel a push run: a deployment may be waiting on it. Superseded pull-request runs are cancelled.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ENV: testing
  FLASK_ENV: testing
  FLASK_SECRET_KEY: test-secret
  JWT_SECRET_KEY: test-secret
  AUTH_DATABASE_URL: sqlite:////tmp/promat/test-ci.sqlite3
  PROMAT_RUNTIME_ROOT: /tmp/promat
  PROMAT_PUBLIC_ROOT: /tmp/promat/public
  POSTGRES_PASSWORD: test-postgres-password
  RATE_LIMIT_STORAGE_URI: redis://rate_limit:6379/0
  AUTH_ACCESS_REQUEST_EMAIL: ci-access@example.test
  AUTH_ACCESS_REQUEST_FROM_EMAIL: ci-noreply@example.test
  AUTH_ACCESS_REQUEST_SMTP_HOST: smtp.example.test

jobs:
  python:
    name: Python (lint, governance, full test suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Prepare runtime layout
        run: |
          mkdir -p /tmp/promat/data/config
          mkdir -p /tmp/promat/data/db/postgres_dev
          mkdir -p /tmp/promat/data/sessions
          mkdir -p /tmp/promat/public
          mkdir -p /tmp/promat/logs

      - name: Ruff check
        run: python -m ruff check .

      - name: Python compile check
        run: python -m compileall -q app scripts

      - name: Governance regression checks
        run: python scripts/ci_governance_checks.py

      - name: Shell script lint
        run: shellcheck --severity=warning scripts/*.sh

      - name: Teaching content validation
        run: python scripts/validate_teaching_content.py

      # The canonical suite. `data`-marked tests validate operator-owned runtime catalogs that are not in the
      # repository and are excluded by pyproject.toml (see docs/runbooks/test-and-ci.md).
      - name: Full pytest suite
        working-directory: app
        run: python -m pytest tests -q

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: JavaScript tests
        run: node --test app/tests/js/*.test.mjs

  docker:
    name: Production image (compose config, build, runtime assets)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Production compose config
        run: docker compose --env-file app/passwords.env.template -f infra/docker-compose.prod.yml config > /dev/null

      - name: Build production image
        run: docker build -f app/Dockerfile -t promat-ci-image .

      - name: Check runtime assets inside the image
        run: |
          docker run --rm -i \
            -e PROMAT_RUNTIME_ROOT=/app \
            -e PROMAT_PUBLIC_ROOT=/tmp/public \
            promat-ci-image python - < scripts/ci_image_smoke.py

  backup-restore:
    name: PostgreSQL backup/restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install runtime dependencies (migration runner)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Disposable databases only: real migrations, a seeded row, backup, and verified restore.
      - name: Backup and restore rehearsal
        env:
          PYTHON: python
        run: scripts/ci_backup_restore_smoke.sh

  release-gate:
    name: release-gate
    # Single status for branch protection and for the deploy workflow's reading of "CI passed".
    if: ${{ always() }}
    needs: [python, javascript, docker, backup-restore]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate job to succeed
        env:
          PYTHON: ${{ needs.python.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          DOCKER: ${{ needs.docker.result }}
          BACKUP_RESTORE: ${{ needs.backup-restore.result }}
        run: |
          echo "python=${PYTHON} javascript=${JAVASCRIPT} docker=${DOCKER} backup-restore=${BACKUP_RESTORE}"
          test "${PYTHON}" = "success" && test "${JAVASCRIPT}" = "success" && test "${DOCKER}" = "success" && test "${BACKUP_RESTORE}" = "success"
