name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_SECRET_KEY: test-secret
      JWT_SECRET_KEY: test-secret
      AUTH_DATABASE_URL: sqlite:////tmp/promat/test-ci.sqlite3
      PROMAT_RUNTIME_ROOT: /tmp/promat
      PROMAT_PUBLIC_ROOT: /tmp/promat/public

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare runtime layout
        run: |
          mkdir -p /tmp/promat/data/config
          mkdir -p /tmp/promat/data/db/postgres_dev
          mkdir -p /tmp/promat/data/sessions
          mkdir -p /tmp/promat/public
          mkdir -p /tmp/promat/logs

      - name: Ruff check
        run: |
          ruff check src/app

      - name: Python compile check
        run: |
          python -m compileall src/app

      - name: Governance regression checks
        run: |
          python ../scripts/ci_governance_checks.py

      - name: Pytest regression suite
        run: |
          python -m pytest tests/test_auth_phase1.py -q
          python -m pytest tests/test_runtime_config.py -q
          python -m pytest tests/test_research_sessions.py -q
          python -m pytest tests/test_research_phenomena.py -q
          python -m pytest tests -q -k "security_headers or csp or access_request or runtime_config or governance"
