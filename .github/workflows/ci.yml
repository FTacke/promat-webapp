name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare runtime layout
        run: |
          mkdir -p /tmp/promat/data/config
          mkdir -p /tmp/promat/data/db/postgres_dev
          mkdir -p /tmp/promat/public
          mkdir -p /tmp/promat/logs

      - name: Ruff check
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: test-secret
          JWT_SECRET_KEY: test-secret
          AUTH_DATABASE_URL: postgresql+psycopg2://promat_auth:promat_auth@127.0.0.1:54321/promat_auth
          PROMAT_RUNTIME_ROOT: /tmp/promat
          PROMAT_PUBLIC_ROOT: /tmp/promat/public
        run: |
          ruff check src/app

      - name: Python compile check
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: test-secret
          JWT_SECRET_KEY: test-secret
          AUTH_DATABASE_URL: postgresql+psycopg2://promat_auth:promat_auth@127.0.0.1:54321/promat_auth
          PROMAT_RUNTIME_ROOT: /tmp/promat
          PROMAT_PUBLIC_ROOT: /tmp/promat/public
        run: |
          python -m compileall src/app