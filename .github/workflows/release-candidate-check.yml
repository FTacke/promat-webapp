name: Release Candidate Check

# Manual pre-release check. The release gate itself (lint, governance, full test suite, JavaScript tests,
# production image build) lives in ci.yml and is reused here instead of being duplicated. On top of it this
# workflow can run the optional responsive smoke against a deployed QA instance.
on:
  workflow_dispatch:
    inputs:
      run_responsive_smoke:
        description: "Run responsive smoke against a provided base URL when QA credentials are available"
        required: false
        default: false
        type: boolean
      responsive_smoke_base_url:
        description: "Base URL for optional responsive smoke (for example https://qa.example.org)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    uses: ./.github/workflows/ci.yml

  responsive-smoke:
    if: ${{ inputs.run_responsive_smoke && inputs.responsive_smoke_base_url != '' }}
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright for the responsive smoke
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Responsive smoke
        env:
          PROMAT_QA_EMAIL: ${{ secrets.PROMAT_QA_EMAIL }}
          PROMAT_QA_PASSWORD: ${{ secrets.PROMAT_QA_PASSWORD }}
          RESPONSIVE_SMOKE_BASE_URL: ${{ inputs.responsive_smoke_base_url }}
        run: |
          if [ -z "$PROMAT_QA_EMAIL" ] || [ -z "$PROMAT_QA_PASSWORD" ]; then
            echo "Skipping responsive smoke: PROMAT_QA_EMAIL/PROMAT_QA_PASSWORD secrets are not configured."
            exit 0
          fi
          python scripts/qa/responsive_smoke.py --run-id github-release-candidate --base-url "$RESPONSIVE_SMOKE_BASE_URL"
