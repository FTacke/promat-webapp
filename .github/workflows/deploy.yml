name: Deploy production

# Production is deployed only for a commit whose CI run succeeded.
#
#   push to main -> CI workflow (.github/workflows/ci.yml, job "release-gate")
#                -> on SUCCESSFUL completion: this workflow (workflow_run)
#                -> self-hosted runner on the production host checks out *that exact commit* and runs
#                   scripts/deploy_prod.sh
#
# Why workflow_run and not a plain `push` trigger: a `push` trigger starts in parallel with CI and cannot wait
# for it. Why the explicit SHA: for `workflow_run` events `github.sha` is the *latest commit of the default
# branch*, not the commit CI tested, so the tested commit must be taken from `workflow_run.head_sha`.
#
# The `workflow_run` event is itself the proof of a finished, successful CI run: it is delivered only after the
# CI run has *completed*, and its payload carries the conclusion and the tested SHA. A deploy that arrives while
# CI is still running therefore cannot exist, and the job below does not ask the "list workflow runs" REST
# endpoint again for the same fact. That endpoint is an eventually consistent index: queried within seconds of
# the completion event it can still miss the run (observed for 1058da9: the lookup failed 6 s after CI finished,
# a rerun 28 s later passed). Only the manual path, which has no event payload, reads that index, and there
# the CI run finished long ago.
#
# Manual runs (workflow_dispatch) are the rollback path: select an older ref in "Use workflow from". The
# commit must have a successful CI run; deploying an untested commit is deliberately not possible. Run CI on
# it first (Actions -> CI -> Run workflow) if needed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # One deployment at a time; never cancel one that is already running on the server.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run: only successful CI runs triggered by a push to main of this repository (never pull
    # requests or forks; a failed, cancelled or skipped CI run never matches 'success').
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: [self-hosted, promat-prod]
    steps:
      - name: Resolve the exact commit to deploy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            # The completed CI run named by the event is the gate (see the header comment); repeat the
            # conclusion check here so the step stays safe even if the job condition is edited.
            [[ "${CI_CONCLUSION}" == "success" ]] || { echo "::error::The triggering CI run concluded '${CI_CONCLUSION}', not 'success'. Refusing to deploy."; exit 1; }
            deploy_sha="${TESTED_SHA}"
          else
            deploy_sha="${DISPATCH_SHA}"
          fi
          [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve a commit SHA to deploy."; exit 1; }

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Manual/rollback run: there is no CI event, so require a successful CI run for exactly this commit.
            ci_runs_file="$(mktemp)"
            http_code="$(
              curl -sSL -o "${ci_runs_file}" -w '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${deploy_sha}&status=success&per_page=1"
            )"
            if [[ "${http_code}" != "200" ]]; then
              rm -f "${ci_runs_file}"
              echo "::error::Could not read the CI runs of ${deploy_sha} (HTTP ${http_code}); not deploying."
              exit 1
            fi
            ci_success_count="$(sed -n 's/.*"total_count"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "${ci_runs_file}" | head -n 1)"
            rm -f "${ci_runs_file}"
            if [[ -z "${ci_success_count}" || "${ci_success_count}" -lt 1 ]]; then
              echo "::error::No successful CI run found for ${deploy_sha}. Refusing to deploy an untested commit."
              exit 1
            fi
          fi

          echo "DEPLOY_SHA=${deploy_sha}" >> "${GITHUB_ENV}"
          echo "Deploying tested commit ${deploy_sha}"

      - name: Skip if a newer commit has reached main
        # Two quick pushes can finish CI out of order. Deploying the older one last would roll production
        # back to older code, so only the commit that is still the tip of main is deployed automatically.
        # (Manual rollbacks to an older commit are exempt.)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          cd /srv/webapps/promat/app
          main_tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "${main_tip}" ]]; then
            echo "::error::Could not determine the current tip of main."
            exit 1
          fi
          if [[ "${main_tip}" != "${DEPLOY_SHA}" ]]; then
            echo "::warning::main moved on to ${main_tip}; skipping ${DEPLOY_SHA}. That commit's own CI run deploys it."
            echo "SKIP_DEPLOY=true" >> "${GITHUB_ENV}"
          fi

      - name: Resolve public deploy metadata
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GOATCOUNTER_URL: https://pronunciation-matters.goatcounter.com/count
        run: |
          set -euo pipefail
          release_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest" || true
          )"
          release_tag="$(printf '%s' "${release_json}" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          release_url="$(printf '%s' "${release_json}" | sed -n 's/.*"html_url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "${release_tag}" ]]; then
            release_tag="dev"
            release_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi
          {
            echo "VITE_APP_VERSION=${release_tag}"
            echo "APP_RELEASE_TAG=${release_tag}"
            echo "APP_RELEASE_URL=${release_url}"
            echo "VITE_GOATCOUNTER_URL=${GOATCOUNTER_URL}"
          } >> "${GITHUB_ENV}"

      - name: Deploy on server
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        run: |
          set -euo pipefail
          cd /srv/webapps/promat/app
          git fetch --prune origin
          git checkout --force "${DEPLOY_SHA}"
          git reset --hard "${DEPLOY_SHA}"
          bash scripts/deploy_prod.sh

      # Read-only GETs against the public site: legal pages, public pages, no public drafts, protected pages
      # redirect to the login, citation URL. A failure here does not roll the deployment back (there is no
      # automatic rollback, see docs/runbooks/deploy-and-rollback.md); it turns the run red so the operator acts.
      - name: Post-deploy smoke (read-only)
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        run: |
          set -euo pipefail
          cd /srv/webapps/promat/app
          for attempt in 1 2 3; do
            if python3 scripts/post_deploy_smoke.py --base-url https://pronunciation-matters.de; then
              exit 0
            fi
            echo "Smoke attempt ${attempt} failed; retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Post-deploy smoke failed three times; see docs/runbooks/deploy-and-rollback.md."
          exit 1
